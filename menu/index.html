<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A0E14">
<title>Carta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&family=Instrument+Sans:wght@400..600&display=swap" rel="stylesheet">
<style>
/* ================= Paletas ================= */
:root, [data-paleta="bordeaux"] {
  --bg: #2A0E14; --raise: #341219; --ink: #F3EAE1; --muted: #C4ABA3; --metal: #DCC291;
  --line: rgba(220, 194, 145, .26); --plate-ink: #2A0E14; --ok: #A9C99A;
}
[data-paleta="nuit"] {
  --bg: #0F1729; --raise: #152034; --ink: #EEE8DC; --muted: #AEB4C2; --metal: #D2B47A;
  --line: rgba(210, 180, 122, .26); --plate-ink: #0F1729; --ok: #9FC7A2;
}
[data-paleta="bouteille"] {
  --bg: #0F271F; --raise: #143128; --ink: #EFE9DB; --muted: #AFBDB2; --metal: #D3AF68;
  --line: rgba(211, 175, 104, .26); --plate-ink: #0F271F; --ok: #B5D69A;
}
[data-paleta="porcelaine"] {
  --bg: #DCD8D0; --raise: #E6E3DC; --ink: #1F1A17; --muted: #574F49; --metal: #7A1E2B;
  --line: rgba(31, 26, 23, .2); --plate-ink: #7A1E2B; --ok: #2F6B3A;
}

/* ================= Base ================= */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 72px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Instrument Sans", system-ui, sans-serif; font-size: 16.5px; line-height: 1.6;
  transition: background-color .6s ease, color .6s ease; -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--metal); outline-offset: 3px; }
.serif, h1, h2, h3 { font-family: "Newsreader", Georgia, serif; font-optical-sizing: auto; font-weight: 400; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 20px; }
.center { text-align: center; }

.switch { display: inline-flex; align-items: center; font-size: 14px; font-weight: 500; }
.switch button { padding: 10px 7px; color: var(--muted); min-height: 44px; min-width: 32px; }
.switch button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--metal); text-decoration-thickness: 1.5px; text-underline-offset: 7px; }
.switch i { width: 1px; height: 14px; background: var(--line); margin: 0 6px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 28px;
  border: 1px solid var(--metal); color: var(--ink); text-decoration: none; font-size: 15.5px; font-weight: 500;
  transition: background-color .25s, color .25s; border-radius: 2px;
}
.btn:hover { background: color-mix(in srgb, var(--metal) 14%, transparent); }
.btn.solid { background: var(--metal); color: var(--bg); }
.btn.solid:hover { background: color-mix(in srgb, var(--metal) 86%, var(--ink)); }
.link { color: var(--metal); font-weight: 500; text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; padding: 6px 0; display: inline-block; }

.heading { font-size: clamp(36px, 9.5vw, 52px); line-height: 1.05; margin: 0; letter-spacing: -.015em; }
.heading::after { content: ""; display: block; width: 32px; height: 1px; background: var(--metal); margin: 24px auto 0; }
.lead { color: var(--muted); margin: 18px auto 0; max-width: 40ch; }

/* ================= Portada ================= */
.cover { min-height: 100svh; display: flex; flex-direction: column; align-items: center; padding: 0 16px 36px; overflow: hidden; }
.cover-top { width: 100%; max-width: 1100px; display: flex; justify-content: space-between; align-items: center; padding-top: env(safe-area-inset-top); }
.place { font-size: 14px; color: var(--muted); margin: 8px 0 0; text-align: center; letter-spacing: .02em; }
.stage { position: relative; width: min(116vw, 66svh, 820px); aspect-ratio: 1; margin-top: -1svh; will-change: transform; }
.stage img {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  -webkit-mask-image: radial-gradient(closest-side, #000 70%, transparent 100%);
          mask-image: radial-gradient(closest-side, #000 70%, transparent 100%);
}
.monogram {
  position: absolute; left: 50%; top: 59.4%; width: 40%; transform: translate(-50%, -50%); margin: 0; text-align: center;
  color: var(--plate-ink); font-weight: 500; line-height: 1; letter-spacing: -.02em;
  font-size: clamp(30px, calc(min(116vw, 66svh, 820px) * .085), 72px); transition: color .6s;
}
.lema { font-family: "Newsreader", Georgia, serif; font-style: italic; font-size: clamp(22px, 5.6vw, 30px); line-height: 1.25; margin: -1svh 0 0; text-align: center; text-wrap: balance; }
.status { display: inline-flex; align-items: center; gap: 9px; margin: 14px 0 0; font-size: 14.5px; color: var(--muted); }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.status.open i { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }
.cover-cta { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; justify-content: center; }

/* ================= Barra fija ================= */
.bar {
  position: fixed; inset: 0 0 auto 0; z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line);
  transform: translateY(-100%); transition: transform .45s cubic-bezier(.2,.7,.2,1), background-color .6s; visibility: hidden;
}
.bar.show { transform: none; visibility: visible; }
.bar-in { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 18px; height: 60px; }
.bar .nm { font-family: "Newsreader", Georgia, serif; font-size: 24px; font-weight: 500; text-decoration: none; flex: none; }
.bar nav { flex: 1; display: flex; gap: 24px; justify-content: center; }
.bar nav a { font-size: 15px; color: var(--muted); text-decoration: none; padding: 8px 0; border-bottom: 1px solid transparent; white-space: nowrap; }
.bar nav a.on { color: var(--ink); border-color: var(--metal); }
@media (max-width: 760px) { .bar nav { display: none; } .bar-in { justify-content: space-between; } }

/* ================= Nota del chef ================= */
.note { padding: 80px 0 16px; text-align: center; }
.note p { font-family: "Newsreader", Georgia, serif; font-style: italic; font-size: clamp(24px, 6vw, 32px); line-height: 1.3; margin: 0 auto; max-width: 24ch; text-wrap: balance; }
.note cite { display: block; font-style: normal; font-size: 15px; color: var(--muted); margin-top: 18px; }

/* ================= Carta ================= */
#carta { padding-top: 72px; }
.filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 32px 0 0; padding: 0; }
.chip {
  border: 1px solid var(--line); border-radius: 999px; padding: 0 16px; min-height: 40px; font-size: 14.5px; color: var(--muted);
  transition: border-color .2s, color .2s, background-color .2s;
}
.chip[aria-pressed="true"] { border-color: var(--metal); color: var(--ink); background: color-mix(in srgb, var(--metal) 14%, transparent); }
.filter-note { text-align: center; color: var(--muted); font-size: 14px; margin: 12px 0 0; min-height: 22px; }

.course { padding: 56px 0 0; text-align: center; }
/* Foto de sección, de borde a borde en el celular */
.ph { position: relative; margin: 0 -20px 40px; aspect-ratio: 4 / 5; overflow: hidden; background: #0E0E0F; }
.ph img { position: absolute; left: 0; top: -8%; width: 100%; height: 116%; object-fit: cover; display: block; will-change: transform; }
.ph .ref { position: absolute; left: 12px; bottom: 12px; font-size: 12.5px; font-weight: 500; color: #F3EAE1; background: rgba(0,0,0,.45); padding: 3px 10px; border-radius: 999px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
@media (min-width: 680px) { .ph { margin: 0 0 44px; aspect-ratio: 16 / 11; } }
.course h3 { font-style: italic; font-size: clamp(30px, 8vw, 40px); line-height: 1.1; margin: 0 0 6px; }
.dishes { list-style: none; margin: 0; padding: 0; }
.dish { padding: 24px 0; border-bottom: 1px solid var(--line); }
.dish:last-child { border-bottom: 0; }
.dish h4 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 23px; line-height: 1.25; margin: 0; }
.dish .mk { font-family: "Instrument Sans", sans-serif; font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 8px; vertical-align: 3px; letter-spacing: .04em; }
.dish p { margin: 6px auto 0; color: var(--muted); max-width: 36ch; }
.dish .pair { display: block; margin-top: 8px; font-family: "Newsreader", Georgia, serif; font-style: italic; font-size: 16.5px; color: var(--ink); opacity: .85; }
.dish .pr { display: inline-block; margin-top: 10px; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--metal); }
.dish.out h4, .dish.out p, .dish.out .pair { opacity: .45; }
.dish .sold { display: inline-block; margin-top: 10px; font-size: 13.5px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); padding: 2px 10px; border-radius: 999px; }
.dish[hidden], .course[hidden] { display: none; }
.empty { text-align: center; color: var(--muted); padding: 40px 0 0; }

/* ================= Degustación ================= */
.tasting { margin: 88px 0 0; padding: 48px 26px; border: 1px solid var(--line); outline: 1px solid var(--line); outline-offset: -8px; text-align: center; }
/* Con foto: la degustación se monta sobre la imagen, siempre en tonos claros sobre oscuro */
.tasting.photo {
  --ink: #F3EAE1; --muted: #D2C6BC; --line: rgba(220, 194, 145, .45);
  position: relative; overflow: hidden; color: var(--ink); border: 0; outline: 0; padding: 0;
  margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); min-height: 120svh; display: flex; align-items: flex-end; justify-content: center;
}
.tasting.photo > img { position: absolute; inset: -8% 0; width: 100%; height: 116%; object-fit: cover; object-position: 50% 40%; will-change: transform; }
.tasting.photo::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(8,6,6,0) 20%, rgba(8,6,6,.55) 55%, rgba(8,6,6,.92) 100%); }
.tasting.photo .box { position: relative; z-index: 2; margin: 0 20px 48px; max-width: 520px; width: 100%; padding: 44px 24px; border: 1px solid var(--line); outline: 1px solid var(--line); outline-offset: -8px;
  background: rgba(10, 8, 8, .38); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.tasting.photo .ref { position: absolute; z-index: 2; left: 12px; top: 12px; font-size: 12.5px; font-weight: 500; background: rgba(0,0,0,.45); padding: 3px 10px; border-radius: 999px; }
.tasting.photo .btn.solid, .tasting.photo .btn { color: var(--ink); border-color: #DCC291; }
.tasting h2 { font-size: clamp(32px, 8.5vw, 44px); margin: 0 0 12px; line-height: 1.1; }
.tasting p { margin: 0 auto; color: var(--muted); max-width: 30ch; }
.tasting .big { font-family: "Newsreader", Georgia, serif; font-size: 46px; margin: 22px 0 0; line-height: 1; }
.tasting .per { font-size: 14.5px; color: var(--muted); margin-top: 6px; }
.tasting .pairing { margin-top: 18px; }
.tasting .pairing b { font-weight: 500; color: var(--metal); margin-left: 6px; }
.tasting .btn { margin-top: 28px; }

/* ================= Experiencias ================= */
.exps { padding-top: 104px; text-align: center; }
.exp-list { list-style: none; margin: 32px 0 0; padding: 0; text-align: left; }
.exp { display: grid; grid-template-columns: 1fr auto; gap: 4px 20px; align-items: baseline; padding: 24px 0; border-top: 1px solid var(--line); }
.exp:last-child { border-bottom: 1px solid var(--line); }
.exp h3 { font-size: 24px; font-weight: 500; margin: 0; line-height: 1.2; }
.exp p { grid-column: 1 / -1; margin: 0; color: var(--muted); max-width: 46ch; }
.exp .link { grid-row: 1; grid-column: 2; font-size: 15px; }

/* ================= Reseñas ================= */
.reviews { padding-top: 104px; text-align: center; }
.score { font-family: "Newsreader", Georgia, serif; font-size: 64px; line-height: 1; margin: 28px 0 8px; }
.stars { display: inline-flex; gap: 4px; color: var(--metal); }
.stars svg { width: 18px; height: 18px; fill: currentColor; }
.count { color: var(--muted); font-size: 14.5px; margin: 8px 0 0; }
.quotes { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 32px -20px 0; padding: 0 20px 8px; scrollbar-width: none; }
.quotes::-webkit-scrollbar { display: none; }
.quote { flex: 0 0 86%; scroll-snap-align: center; margin: 0; padding: 28px 24px; background: var(--raise); border: 1px solid var(--line); text-align: left; transition: background-color .6s; }
.quote p { font-family: "Newsreader", Georgia, serif; font-size: 20px; line-height: 1.4; margin: 0; }
.quote cite { display: block; font-style: normal; color: var(--muted); font-size: 14.5px; margin-top: 16px; }
@media (min-width: 760px) { .quotes { flex-direction: column; overflow: visible; margin: 32px 0 0; padding: 0; } .quote { flex: none; } }
.reviews .link { margin-top: 22px; }

/* ================= Reservar ================= */
.reserve { padding-top: 104px; text-align: center; }
form.book { margin: 32px 0 0; text-align: left; display: grid; gap: 18px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field label, .field .lbl { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; min-height: 52px; padding: 12px 14px; background: var(--raise); border: 1px solid var(--line); border-radius: 2px;
  font-size: 16px; color-scheme: dark; transition: border-color .2s, background-color .6s;
}
[data-paleta="porcelaine"] .field input, [data-paleta="porcelaine"] .field select, [data-paleta="porcelaine"] .field textarea { color-scheme: light; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--metal); outline: none; }
.field textarea { min-height: 88px; resize: vertical; }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); background: var(--raise); min-height: 52px; border-radius: 2px; }
.stepper button { width: 52px; height: 52px; font-size: 22px; color: var(--metal); flex: none; }
.stepper output { flex: 1; text-align: center; font-size: 17px; font-weight: 500; }
.hint { font-size: 14px; min-height: 20px; margin: 6px 0 0; color: var(--muted); }
.hint.bad { color: var(--metal); }
form.book .btn { width: 100%; margin-top: 6px; }
.fine { font-size: 13.5px; color: var(--muted); text-align: center; margin: 4px 0 0; }

/* ================= Información ================= */
.info { padding-top: 96px; display: grid; gap: 34px; }
.info h3 { font-size: 22px; font-weight: 500; margin: 0 0 10px; }
.week { list-style: none; margin: 0; padding: 0; }
.week li { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
.week li.today { color: var(--ink); font-weight: 500; }
.info p { margin: 0; }
footer { margin-top: 80px; border-top: 1px solid var(--line); padding: 32px 20px 128px; text-align: center; color: var(--muted); font-size: 14px; }
footer p { margin: 0 auto 6px; max-width: 52ch; }

/* ================= Reservar fijo (móvil) ================= */
.dock {
  position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 25;
  transform: translateY(160%); transition: transform .4s cubic-bezier(.2,.7,.2,1);
}
.dock.show { transform: none; }
.dock .btn { box-shadow: 0 12px 36px rgba(0,0,0,.35); min-height: 50px; }

/* ================= Panel de demo ================= */
.demo-btn {
  position: fixed; left: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 30;
  display: flex; align-items: center; gap: 10px; padding: 0 16px 0 12px; min-height: 50px;
  background: var(--ink); color: var(--bg); border-radius: 999px; font-size: 14.5px; font-weight: 500;
  box-shadow: 0 12px 36px rgba(0,0,0,.35); transition: background-color .6s, color .6s;
}
.demo-btn .dots { display: flex; }
.demo-btn .dots i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ink); margin-left: -4px; }
.demo-btn .dots i:first-child { margin-left: 0; }
.demo-btn { transform: translateY(160%); transition: transform .4s cubic-bezier(.2,.7,.2,1), background-color .6s, color .6s; }
.demo-btn.show { transform: none; }
.demo-top { font-size: 14px; font-weight: 500; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; min-height: 36px; }
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .3s; }
.sheet {
  position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; background: var(--bg); color: var(--ink);
  border: 1px solid var(--line); border-bottom: 0; padding: 28px 22px calc(26px + env(safe-area-inset-bottom));
  transform: translateY(105%); transition: transform .4s cubic-bezier(.2,.8,.2,1), background-color .6s; max-height: 90svh; overflow-y: auto;
}
.open .scrim { opacity: 1; pointer-events: auto; }
.open .sheet { transform: none; }
.sheet h2 { font-size: 30px; margin: 0 0 4px; }
.sheet .sub { color: var(--muted); font-size: 15px; margin: 0 0 22px; }
.sheet h3 { font-family: "Instrument Sans", sans-serif; font-weight: 500; font-size: 14.5px; color: var(--muted); margin: 26px 0 12px; }
.pals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pal { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; }
.pal .sw { width: 56px; height: 56px; border-radius: 50%; position: relative; box-shadow: 0 0 0 1px var(--line); }
.pal .sw::after { content: ""; position: absolute; inset: 15px; border-radius: 50%; background: #EEEBE5; box-shadow: 0 0 0 2px var(--rim); }
.pal[aria-pressed="true"] .sw { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--ink); }
.metals { display: flex; gap: 14px; }
.metal { width: 38px; height: 38px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
.metal[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--ink); }
.qrs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.qr { text-align: center; font-size: 14px; color: var(--muted); }
.qr .code { background: #fff; padding: 8px; width: 100%; max-width: 150px; aspect-ratio: 1; margin: 0 auto 8px; }
.qr .code img, .qr .code canvas { width: 100% !important; height: auto !important; display: block; }
.qr button { color: var(--metal); font-weight: 500; text-decoration: underline; text-underline-offset: 4px; padding: 6px; }
.x { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; font-size: 24px; color: var(--muted); }

/* ================= Un solo momento de entrada ================= */
@media (prefers-reduced-motion: no-preference) {
  .stage img { animation: plate 2.2s cubic-bezier(.2,.7,.2,1) both; }
  .monogram { animation: ink 1.4s ease .9s both; }
  .lema, .status, .cover-cta, .place { animation: fade 1.1s ease 1.4s both; }
  @keyframes plate { from { opacity: 0; transform: scale(1.08) rotate(-8deg); } to { opacity: 1; transform: none; } }
  @keyframes ink { from { opacity: 0; filter: blur(6px); } to { opacity: 1; filter: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
}
</style>
</head>
<body>

<div class="bar" id="bar">
  <div class="bar-in">
    <a class="nm" href="#top" id="barName"></a>
    <nav id="barNav" aria-label="Secciones"></nav>
    <div class="switch">
      <button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button><i></i>
      <button type="button" data-cur="crc" aria-label="Colones">₡</button><button type="button" data-cur="usd" aria-label="Dólares">$</button>
    </div>
  </div>
</div>

<header class="cover" id="top">
  <div class="cover-top">
    <div class="switch" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button>
    </div>
    <button type="button" class="demo-top" id="demoTop" hidden>Paleta</button>
    <div class="switch" role="group" aria-label="Moneda / Currency">
      <button type="button" data-cur="crc" aria-label="Colones">₡</button><button type="button" data-cur="usd" aria-label="Dólares">$</button>
    </div>
  </div>
  <p class="place" id="place"></p>
  <div class="stage" id="stage">
    <img id="plate" alt="" width="1400" height="1400" decoding="async" fetchpriority="high">
    <h1 class="monogram" id="mono"></h1>
  </div>
  <p class="lema" id="lema"></p>
  <p class="status" id="status"><i></i><span></span></p>
  <div class="cover-cta">
    <a class="btn solid" href="#reservar" data-t="reserveBtn"></a>
    <a class="btn" href="#carta" data-t="menuBtn"></a>
  </div>
</header>

<main class="wrap">
  <section class="note"><p id="noteTxt"></p><cite id="noteSig"></cite></section>

  <section id="carta" class="center">
    <h2 class="heading" data-t="menuTitle"></h2>
    <div class="filters" id="filters" role="group"></div>
    <p class="filter-note" id="filterNote" aria-live="polite"></p>
    <div id="courses"></div>
  </section>

  <section class="tasting" id="degustacion"></section>

      <div class="row2">

        <div class="field"><span class="lbl" id="pLbl" data-t="fPeople"></span>
          <div class="stepper" role="group" aria-labelledby="pLbl">
            <button type="button" id="pMinus" aria-label="−">−</button><output id="people">2</output><button type="button" id="pPlus" aria-label="+">+</button>

    <div><h3 data-t="hours"></h3><ul class="week" id="week"></ul></div>
    <div><h3 data-t="where"></h3><p id="addr"></p><a class="link" id="map" target="_blank" rel="noopener" data-t="directions"></a></div>

  </section>

<footer><p id="legend"></p><p id="taxes"></p></footer>

<div class="dock" id="dock"><a class="btn solid" href="#reservar" data-t="reserveBtn"></a></div>

  <button class="demo-btn" id="demoOpen" type="button" aria-haspopup="dialog">
    <span class="dots"><i style="background:#2A0E14"></i><i style="background:#0F1729"></i><i style="background:#0F271F"></i><i style="background:#DCD8D0"></i></span>
    Paleta
  </button>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
    <button class="x" id="demoClose" type="button" aria-label="Cerrar">×</button>
    <h2 id="sheetT">La identidad de tu casa</h2>
    <p class="sub">Tocá una paleta y toda la web cambia. Tus platos y precios se quedan igual.</p>

    <div class="qrs">
      <div class="qr"><div class="code" id="qrMenu"></div>Para las mesas<br><button type="button" data-dl="qrMenu">Descargar</button></div>
      <div class="qr"><div class="code" id="qrRev"></div>Para la cuenta: reseñas en Google<br><button type="button" data-dl="qrRev">Descargar</button></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  const R = window.RESTAURANTE;
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const q = new URLSearchParams(location.search);
  const TZ = "America/Costa_Rica";
  const DEMO = q.get("cliente") !== "1" && R.modoDemo !== false;

  const PALETAS = {
    bordeaux:   { nombre: "Bordeaux",   bg: "#2A0E14", rim: "#DCC291" },
    nuit:       { nombre: "Nuit",       bg: "#0F1729", rim: "#D2B47A" },
    bouteille:  { nombre: "Bouteille",  bg: "#0F271F", rim: "#D3AF68" },
    porcelaine: { nombre: "Porcelaine", bg: "#DCD8D0", rim: "#7A1E2B" }
  };
  const METALES = [{ n: "Oro", c: null }, { n: "Plata", c: "#C9CCD1" }, { n: "Cobre", c: "#C99068" }, { n: "Champán", c: "#E8D6B2" }];

  const T = {
    es: {
      menuBtn: "Ver la carta", reserveBtn: "Reservar mesa", menuTitle: "La carta", expTitle: "Experiencias", revTitle: "Lo que dicen",
      revWrite: "Escribir una reseña en Google", resTitle: "Reservar mesa", resLead: "Elegí el día y la hora. Te confirmamos por WhatsApp en minutos.",
      fDate: "Día", fTime: "Hora", fPeople: "Personas", fOcc: "Ocasión", fName: "Nombre", fNotes: "Alergias o pedidos especiales",
      send: "Enviar reserva por WhatsApp", fine: "Se abre WhatsApp con tu reserva escrita. Solo tenés que enviarla.",
      hours: "Horario", where: "Dónde estamos", directions: "Abrir en el mapa", per: "por persona", ask: "Consultar",
      tastingBtn: "Reservar el menú degustación", closed: "Ese día estamos cerrados. Elegí otro, por favor.", pickDate: "Elegí un día para reservar.",
      nameMissing: "Escribí tu nombre para la reserva.",
      openNow: (c) => "Abierto ahora, cierra a las " + c, opensAt: (d, h) => "Cerrado, abre " + d + " a las " + h, today: "hoy", tomorrow: "mañana",
      filters: { sg: "Sin gluten", v: "Vegetariano", vg: "Vegano", mariscos: "Sin mariscos", nueces: "Sin nueces", lacteos: "Sin lácteos" },
      showing: (n) => n === 1 ? "1 plato para vos" : n + " platos para vos", clear: "Quitar filtros", none: "Ningún plato cumple todos esos filtros.",
      sold: "Agotado hoy", with: "Con ", ref: "Foto de referencia", occ: { "": "Ninguna en especial", cumple: "Cumpleaños", aniversario: "Aniversario", negocios: "Cena de negocios", propuesta: "Propuesta de matrimonio", chef: "Mesa del chef", playa: "Cena privada en la playa", jazz: "Jazz los viernes", degustacion: "Menú degustación" },
      msg: { hi: "Hola, quisiera reservar en ", date: "Día", time: "Hora", people: "Personas", occ: "Ocasión", name: "Nombre", notes: "Notas" },
      days: ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"], closedDay: "Cerrado",
      reviews: (n) => n.toLocaleString("es-CR") + " reseñas en Google",
      legend: "v vegetariano    vg vegano    sg sin gluten",
      taxes: "Precios en colones con impuestos y servicio incluidos. Lo que ves es lo que pagás.",
      taxesUsd: "Precios en dólares al tipo de cambio del día, con impuestos y servicio incluidos.",
      mk: { v: "v", vg: "vg", sg: "sg" }
    },
    en: {
      menuBtn: "See the menu", reserveBtn: "Book a table", menuTitle: "The menu", expTitle: "Experiences", revTitle: "What guests say",
      revWrite: "Write a Google review", resTitle: "Book a table", resLead: "Pick a day and time. We confirm on WhatsApp within minutes.",
      fDate: "Day", fTime: "Time", fPeople: "Guests", fOcc: "Occasion", fName: "Name", fNotes: "Allergies or special requests",
      send: "Send booking on WhatsApp", fine: "WhatsApp opens with your booking already written. Just hit send.",
      hours: "Hours", where: "Find us", directions: "Open in maps", per: "per person", ask: "Enquire",
      tastingBtn: "Book the tasting menu", closed: "We're closed that day. Please pick another.", pickDate: "Pick a day to book.",
      nameMissing: "Add your name for the booking.",
      openNow: (c) => "Open now, closes at " + c, opensAt: (d, h) => "Closed, opens " + d + " at " + h, today: "today", tomorrow: "tomorrow",
      filters: { sg: "Gluten-free", v: "Vegetarian", vg: "Vegan", mariscos: "No shellfish", nueces: "No nuts", lacteos: "No dairy" },
      showing: (n) => n === 1 ? "1 dish for you" : n + " dishes for you", clear: "Clear filters", none: "No dish matches all those filters.",
      sold: "Sold out today", with: "With ", ref: "Reference photo", occ: { "": "Nothing special", cumple: "Birthday", aniversario: "Anniversary", negocios: "Business dinner", propuesta: "Marriage proposal", chef: "Chef's table", playa: "Private beach dinner", jazz: "Jazz Friday", degustacion: "Tasting menu" },
      msg: { hi: "Hello, I'd like to book a table at ", date: "Day", time: "Time", people: "Guests", occ: "Occasion", name: "Name", notes: "Notes" },
      days: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"], closedDay: "Closed",
      reviews: (n) => n.toLocaleString("en-US") + " Google reviews",
      legend: "v vegetarian    vg vegan    gf gluten-free",
      taxes: "Prices in colones, taxes and service included. What you see is what you pay.",
      taxesUsd: "Prices in US dollars at today's rate, taxes and service included.",
      mk: { v: "v", vg: "vg", sg: "gf" }
    }
  };

  let lang = store.get("carta-lang") || ((navigator.language || "es").slice(0, 2) === "es" ? "es" : "en");
  let cur = store.get("carta-cur") || (lang === "en" ? "usd" : "crc");
  let paleta = PALETAS[q.get("paleta")] ? q.get("paleta") : (PALETAS[R.paleta] ? R.paleta : "bordeaux");
  let metal = R.metal || null;
  let filters = new Set();
  let people = 2;

  const t = (o) => (o && (o[lang] || o.es)) || "";
  const L = () => T[lang];
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const price = (crc) => cur === "usd" ? "$" + Math.round(crc / R.tipoCambio) : String(crc).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const toMin = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
  const fmtTime = (min) => {
    const h = Math.floor(min / 60) % 24, m = min % 60;
    if (lang === "en") return ((h % 12) || 12) + (m ? ":" + String(m).padStart(2, "0") : "") + (h < 12 ? " am" : " pm");
    return ((h % 12) || 12) + (m ? ":" + String(m).padStart(2, "0") : "") + (h < 12 ? " am" : " pm");
  };
  // Hora actual en Costa Rica, sin importar dónde esté el teléfono
  function nowCR() {
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit" })
      .formatToParts(new Date()).map((x) => [x.type, x.value]));
    const wd = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(p.weekday);
    return { wd, min: Number(p.hour) * 60 + Number(p.minute), iso: p.year + "-" + p.month + "-" + p.day };
  }

  /* ---------- Hoja de Google opcional ---------- */
  function loadSheet() {
    if (!R.hojaGoogle) return;
    fetch(R.hojaGoogle, { cache: "no-store" }).then((r) => r.ok ? r.text() : "").then((csv) => {
      if (!csv) return;
      const rows = csv.trim().split(/\r?\n/).map((l) => l.split(",").map((c) => c.trim().replace(/^"|"$/g, "")));
      const head = rows.shift().map((h) => h.toLowerCase());
      const iId = head.indexOf("id"), iP = head.indexOf("precio"), iA = head.indexOf("agotado");
      const map = {}; rows.forEach((r) => { map[r[iId]] = r; });
      R.categorias.forEach((c) => c.platos.forEach((p) => {
        const r = map[p.id]; if (!r) return;
        if (iP > -1 && Number(r[iP])) p.precio = Number(r[iP]);
        if (iA > -1) p.agotado = /^(si|sí|yes|x|1)$/i.test(r[iA]);
      }));
      renderMenu();
    }).catch(() => {});
  }

  /* ---------- Paleta ---------- */
  function applyPaleta() {
    const html = document.documentElement;
    html.setAttribute("data-paleta", paleta);
    if (metal) html.style.setProperty("--metal", metal); else html.style.removeProperty("--metal");
    const img = $("#plate"), src = "img/" + paleta + ".jpg";
    if (!img.getAttribute("src")) img.src = src;
    else if (!img.src.endsWith(src)) {
      img.style.transition = "opacity .3s"; img.style.opacity = 0;
      const n = new Image(); n.onload = () => { img.src = src; img.style.opacity = 1; }; n.src = src;
    }
    $('meta[name="theme-color"]').content = PALETAS[paleta].bg;
    $$(".pal").forEach((b) => b.setAttribute("aria-pressed", b.dataset.p === paleta));
    $$(".metal").forEach((b) => b.setAttribute("aria-pressed", (b.dataset.m || null) === metal));
  }

  /* ---------- Estado abierto / cerrado ---------- */
  function renderStatus() {
    const H = R.horario, n = nowCR(), a = toMin(H.abre), c = toMin(H.cierra);
    const open = H.dias.includes(n.wd) && n.min >= a && n.min < c;
    let txt;
    if (open) txt = L().openNow(fmtTime(c));
    else {
      let d = 0;
      while (d < 8 && !(H.dias.includes((n.wd + d) % 7) && (d > 0 || n.min < a))) d++;
      const label = d === 0 ? L().today : d === 1 ? L().tomorrow : L().days[(n.wd + d) % 7].toLowerCase();
      txt = L().opensAt(label, fmtTime(a));
    }
    $("#status").classList.toggle("open", open);
    $("#status span").textContent = txt;
  }

  /* ---------- Carta ---------- */
  function passes(p) {
    for (const f of filters) {
      if (["sg", "v", "vg"].includes(f)) {
        const m = p.marcas || [];
        if (f === "v" ? !(m.includes("v") || m.includes("vg")) : !m.includes(f)) return false;
      } else if ((p.contiene || []).includes(f)) return false;
    }
    return true;
  }
  function renderMenu() {
    const F = L().filters;
    $("#filters").setAttribute("aria-label", lang === "es" ? "Filtrar por dieta o alergia" : "Filter by diet or allergy");
    $("#filters").innerHTML = Object.keys(F).map((k) =>
      '<button class="chip" type="button" data-f="' + k + '" aria-pressed="' + filters.has(k) + '">' + F[k] + "</button>").join("");

    let shown = 0;
    $("#courses").innerHTML = R.categorias.map((c) => {
      const items = c.platos.filter(passes); shown += items.length;
      if (!items.length) return "";
      const ph = c.foto ? '<figure class="ph"><img src="' + c.foto + '" alt="" loading="lazy" decoding="async">' + (DEMO ? '<span class="ref">' + L().ref + "</span>" : "") + "</figure>" : "";
      return '<section class="course" id="' + c.id + '">' + ph + "<h3>" + esc(t(c.nombre)) + '</h3><ul class="dishes">' + items.map((p) => {
        const mk = (p.marcas || []).map((k) => L().mk[k]).join(" ");
        return '<li class="dish' + (p.agotado ? " out" : "") + '"><h4>' + esc(t(p.nombre)) + (mk ? '<span class="mk">' + mk + "</span>" : "") + "</h4>" +
          (p.desc ? "<p>" + esc(t(p.desc)) + "</p>" : "") +
          (p.maridaje ? '<span class="pair">' + L().with + esc(t(p.maridaje)) + "</span>" : "") +
          (p.agotado ? '<span class="sold">' + L().sold + "</span>" : '<span class="pr">' + price(p.precio) + "</span>") + "</li>";
      }).join("") + "</ul></section>";
    }).join("") + (shown ? "" : '<p class="empty">' + L().none + "</p>");

    $("#filterNote").innerHTML = filters.size
      ? L().showing(shown) + ' <button type="button" class="link" id="clearF" style="margin-left:8px;font-size:14px">' + L().clear + "</button>" : "";

    const d = R.degustacion;
    $("#degustacion").hidden = !d;
    if (d) {
      const inner = "<h2>" + esc(t(d.nombre)) + "</h2><p>" + esc(t(d.desc)) + '</p><div class="big">' + price(d.precio) +
        '</div><div class="per">' + L().per + '</div><div class="pairing">' + esc(t(d.maridaje)) + "<b>" + price(d.precioMaridaje) + "</b></div>" +
        '<a class="btn" href="#reservar" data-occ="degustacion">' + L().tastingBtn + "</a>";
      $("#degustacion").classList.toggle("photo", !!d.foto);
      $("#degustacion").innerHTML = d.foto
        ? '<img src="' + d.foto + '" alt="" loading="lazy" decoding="async">' + (DEMO ? '<span class="ref">' + L().ref + "</span>" : "") + '<div class="box">' + inner + "</div>"
        : inner;
    }
  }

  /* ---------- Reserva ---------- */
  function slots() {
    const a = toMin(R.horario.abre), c = toMin(R.horario.cierra), out = [];
    for (let m = a; m <= c - 60; m += 30) out.push(m);
    return out;
  }
  function renderForm() {
    const n = nowCR();
    const di = $("#fDate"); di.min = n.iso;
    if (!di.value) {
      let d = 0; while (d < 8 && !R.horario.dias.includes((n.wd + d) % 7)) d++;
      const dt = new Date(n.iso + "T12:00:00"); dt.setDate(dt.getDate() + d);
      di.value = dt.toISOString().slice(0, 10);
    }
    const prevT = $("#fTime").value;
    $("#fTime").innerHTML = slots().map((m) => '<option value="' + m + '">' + fmtTime(m) + "</option>").join("");
    if (prevT) $("#fTime").value = prevT; else $("#fTime").value = String(toMin(R.horario.abre) + 90);
    const prevO = $("#fOcc").value;
    $("#fOcc").innerHTML = Object.entries(L().occ).map(([k, v]) => '<option value="' + k + '">' + v + "</option>").join("");
    $("#fOcc").value = prevO || "";
    checkDate();
  }
  function checkDate() {
    const v = $("#fDate").value, h = $("#dateHint");
    if (!v) { h.textContent = ""; return true; }
    const wd = new Date(v + "T12:00:00").getDay();
    const ok = R.horario.dias.includes(wd);
    h.textContent = ok ? L().days[wd] : L().closed;
    h.classList.toggle("bad", !ok);
    return ok;
  }
  $("#fDate").addEventListener("change", checkDate);
  $("#pMinus").onclick = () => { people = Math.max(1, people - 1); $("#people").textContent = people; };
  $("#pPlus").onclick = () => { people = Math.min(20, people + 1); $("#people").textContent = people; };
  $("#book").addEventListener("submit", (e) => {
    e.preventDefault();
    const h = $("#dateHint");
    if (!$("#fDate").value) { h.textContent = L().pickDate; h.classList.add("bad"); $("#fDate").focus(); return; }
    if (!checkDate()) { $("#fDate").focus(); return; }
    if (!$("#fName").value.trim()) { h.textContent = L().nameMissing; h.classList.add("bad"); $("#fName").focus(); return; }
    const M = L().msg, dt = new Date($("#fDate").value + "T12:00:00");
    const dateTxt = dt.toLocaleDateString(lang === "es" ? "es-CR" : "en-US", { weekday: "long", day: "numeric", month: "long" });
    const occ = $("#fOcc").value;
    const lines = [M.hi + R.nombre + ".", "", M.date + ": " + dateTxt, M.time + ": " + fmtTime(Number($("#fTime").value)), M.people + ": " + people];
    if (occ) lines.push(M.occ + ": " + L().occ[occ]);
    lines.push(M.name + ": " + $("#fName").value.trim());
    if ($("#fNotes").value.trim()) lines.push(M.notes + ": " + $("#fNotes").value.trim());
    window.open("https://wa.me/" + R.whatsapp + "?text=" + encodeURIComponent(lines.join("\n")), "_blank", "noopener");
  });

  /* ---------- Resto del contenido ---------- */
  function renderAll() {
    document.documentElement.lang = lang;
    document.title = R.nombre + (lang === "es" ? ", carta y reservas" : ", menu and bookings");
    $$("[data-t]").forEach((el) => { el.textContent = L()[el.dataset.t]; });
    $("#mono").textContent = R.nombre;
    $("#barName").textContent = R.nombre;
    $("#place").textContent = t(R.lugar);
    $("#lema").textContent = t(R.lema);
    $("#noteTxt").textContent = t(R.nota.texto);
    $("#noteSig").textContent = t(R.nota.firma);
    $("#barNav").innerHTML = [["carta", L().menuTitle], ["degustacion", t(R.degustacion.nombre)], ["experiencias", L().expTitle], ["resenas", L().revTitle], ["reservar", L().reserveBtn]]
      .map(([id, n]) => '<a href="#' + id + '" data-id="' + id + '">' + esc(n) + "</a>").join("");

    $("#exps").innerHTML = R.experiencias.map((x) => '<li class="exp"><h3>' + esc(t(x.nombre)) + '</h3><a class="link" href="#reservar" data-occ="' + x.ocasion + '">' + L().ask +
      "</a><p>" + esc(t(x.desc)) + "</p></li>").join("");

    const rv = R.resenas;
    $("#score").textContent = rv.nota.toLocaleString(lang === "es" ? "es-CR" : "en-US", { minimumFractionDigits: 1 });
    $("#stars").innerHTML = Array(5).fill('<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>').join("");
    $("#count").textContent = L().reviews(rv.total);
    $("#quotes").innerHTML = rv.lista.map((r) => '<figure class="quote"><p>' + esc(t(r.texto)) + "</p><cite>" + esc(r.autor) + "</cite></figure>").join("");
    $("#revLink").href = R.resenaGoogle;

    const n = nowCR();
    $("#week").innerHTML = [1, 2, 3, 4, 5, 6, 0].map((d) => '<li class="' + (d === n.wd ? "today" : "") + '"><span>' + L().days[d] + "</span><span>" +
      (R.horario.dias.includes(d) ? fmtTime(toMin(R.horario.abre)) + " – " + fmtTime(toMin(R.horario.cierra)) : L().closedDay) + "</span></li>").join("");
    $("#addr").textContent = t(R.direccion); $("#map").href = R.mapa;
    $("#ig").textContent = "@" + R.instagram; $("#ig").href = "https://instagram.com/" + R.instagram;
    $("#legend").textContent = L().legend;
    $("#taxes").textContent = cur === "usd" ? L().taxesUsd : L().taxes;

    $$("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    $$("[data-cur]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.cur === cur));
    renderStatus(); renderMenu(); renderForm(); observe();
  }

  /* ---------- Scroll ---------- */
  let io;
  function observe() {
    if (io) io.disconnect();
    io = new IntersectionObserver((es) => es.forEach((e) => {
      if (e.isIntersecting) $$("#barNav a").forEach((a) => a.classList.toggle("on", a.dataset.id === e.target.id));
    }), { rootMargin: "-45% 0px -50% 0px" });
    ["carta", "degustacion", "experiencias", "resenas", "reservar"].forEach((id) => io.observe(document.getElementById(id)));
  }
  const stage = $("#stage"), bar = $("#bar"), dock = $("#dock"), resv = $("#reservar"), demoBtn = $("#demoOpen");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let ticking = false;
  function onScroll() {
    const y = scrollY, h = innerHeight;
    bar.classList.toggle("show", y > h * 0.8);
    const r = resv.getBoundingClientRect();
    dock.classList.toggle("show", y > h * 0.8 && innerWidth < 760 && (r.top > h || r.bottom < 0));
    demoBtn.classList.toggle("show", y > h * 0.8);
    if (!still && y < h * 1.3) {
      const k = Math.min(y / h, 1);
      stage.style.transform = "translateY(" + (k * h * 0.2) + "px) scale(" + (1 - k * 0.12) + ") rotate(" + (k * 16) + "deg)";
      stage.style.opacity = 1 - k * 0.9;
    }
    if (!still) $$(".ph img, .tasting.photo > img").forEach((img) => {
      const r2 = img.parentElement.getBoundingClientRect();
      if (r2.bottom < 0 || r2.top > h) return;
      const k2 = (r2.top + r2.height / 2 - h / 2) / h;
      img.style.transform = "translateY(" + (k2 * -6) + "%)";
    });
    ticking = false;
  }
  addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });

  /* ---------- Clics ---------- */
  document.addEventListener("click", (e) => {
    const occA = e.target.closest("[data-occ]");
    if (occA) { $("#fOcc").value = occA.dataset.occ; }
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.lang) { lang = b.dataset.lang; store.set("carta-lang", lang); renderAll(); }
    else if (b.dataset.cur) { cur = b.dataset.cur; store.set("carta-cur", cur); renderAll(); }
    else if (b.dataset.f) { filters.has(b.dataset.f) ? filters.delete(b.dataset.f) : filters.add(b.dataset.f); renderMenu(); }
    else if (b.id === "clearF") { filters.clear(); renderMenu(); }
    else if (b.dataset.p) { paleta = b.dataset.p; applyPaleta(); }
    else if (b.classList.contains("metal")) { metal = b.dataset.m || null; applyPaleta(); }
    else if (b.dataset.dl) {
      const c = document.querySelector("#" + b.dataset.dl + " canvas"); if (!c) return;
      const a = document.createElement("a"); a.download = b.dataset.dl + "-" + R.nombre.toLowerCase().replace(/\s+/g, "-") + ".png";
      a.href = c.toDataURL("image/png"); a.click();
    }
  });

  /* ---------- Panel de demo ---------- */
  if (DEMO) {
    $("#demo").hidden = false;
    $("#pals").innerHTML = Object.entries(PALETAS).map(([k, v]) =>
      '<button class="pal" type="button" data-p="' + k + '"><span class="sw" style="background:' + v.bg + ";--rim:" + v.rim + '"></span>' + v.nombre + "</button>").join("");
    $("#metals").innerHTML = METALES.map((m) => '<button class="metal" type="button" data-m="' + (m.c || "") + '" aria-label="' + m.n + '" title="' + m.n +
      '" style="background:' + (m.c || "linear-gradient(135deg,#ECD39A,#B98F45)") + '"></button>').join("");
    const open = () => { document.body.classList.add("open"); $("#demoClose").focus(); };
    const close = () => { document.body.classList.remove("open"); $("#demoOpen").focus(); };
    $("#demoTop").hidden = false; $("#demoTop").onclick = open;
    $("#demoOpen").onclick = open; $("#demoClose").onclick = close; $("#scrim").onclick = close;
    addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
    if (window.QRCode) {
      const opt = (text) => ({ text, width: 280, height: 280, colorDark: "#111111", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
      new QRCode($("#qrMenu"), opt(location.href.split("?")[0] + "?cliente=1"));
      new QRCode($("#qrRev"), opt(R.resenaGoogle));
    }
  }

  /* ---------- Sin señal: guardar la carta en el teléfono ---------- */
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }

  renderAll(); applyPaleta(); onScroll(); loadSheet();
  setInterval(renderStatus, 60000);
})();
</script>
</body>
</html>
