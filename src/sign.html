<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comprar</title>
<style>
:root{--bg:#15171b;--fg:#eceef2;--ac:#5ad3a4;--card:#1e2127;--mut:#8f95a3;--bad:#e5837f}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Inter","SF Pro Text","Helvetica Neue","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
main{min-height:100dvh;max-width:380px;margin:0 auto;padding:20px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
code,.mono{font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace}
.av{width:clamp(72px,16dvh,96px);aspect-ratio:1;border-radius:24%;display:grid;place-items:center;font-size:2.2rem;font-weight:700;color:#0c1a14;background:var(--ac);object-fit:cover}
h1{margin:2px 0 0;font-family:"Inter Tight","SF Pro Display","Helvetica Neue","Segoe UI",system-ui,sans-serif;font-size:clamp(1.8rem,8vw,2.3rem);line-height:1.08;font-weight:700;letter-spacing:-.03em;word-break:break-word}
.sym{margin-top:2px;color:var(--ac);font-weight:600;letter-spacing:.04em;font-size:.95rem}
.lazy{font-size:.78rem;color:var(--mut);letter-spacing:.01em}
.addr{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:8px 10px}
.addr code{font-size:.64rem;color:var(--mut);word-break:break-all;text-align:left}
.copy{flex:none;border:0;background:#2a2e36;color:var(--fg);border-radius:8px;padding:5px 10px;font:500 .68rem system-ui,sans-serif;cursor:pointer}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.facts span{background:var(--card);border-radius:99px;padding:4px 11px;font-size:.68rem;font-weight:500;color:#b9bec9}
.who{font-size:.68rem;color:var(--mut);line-height:1.55}.who code{font-size:.62rem;color:#b9bec9}
#info{font-size:.8rem;color:#c9cdd6}
.red{color:var(--bad);font-size:.72rem;font-weight:500}
.btn{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;padding:15px;border:0;border-radius:14px;font:600 1rem "Inter","SF Pro Text",system-ui,sans-serif;letter-spacing:-.005em;text-decoration:none;cursor:pointer;transition:transform .08s,box-shadow .08s;margin-bottom:8px}
#gh{color:#f0f2f5;background:#2a2e36;box-shadow:0 0 0 1px #3a404b inset,0 3px 0 #0d0f12}
#uni{color:#0c1a14;background:var(--ac);box-shadow:0 3px 0 color-mix(in srgb,var(--ac) 45%,#000)}
#go{color:#0c1a14;background:var(--ac);box-shadow:0 3px 0 color-mix(in srgb,var(--ac) 45%,#000)}
.btn:active:not(:disabled){transform:translateY(3px)}
#src{text-decoration:underline}
#gh:active{box-shadow:0 0 0 1px #3a404b inset,0 0 0 #0d0f12}
#go:active:not(:disabled){box-shadow:0 0 0 transparent}
#go:disabled{background:#2a2e36;color:#6f7582;box-shadow:none;cursor:not-allowed}
.btn svg{width:22px;height:22px;fill:currentColor;flex:none}
.cap{font-size:.76rem;color:var(--mut)}
#st{min-height:1.2em;font-size:.8rem;margin:0}
.tiny{font-size:.62rem;color:#666c79;margin:0}
</style></head><body><main>
<img class="av" id="img" alt="" hidden><div class="av" id="av"></div>
<div><h1 id="t">Token</h1><div class="sym" id="sy"></div></div>
<div class="lazy" id="lz"></div>
<div class="addr"><code id="addr"></code><button class="copy" id="cp" type="button">Copiar</button></div>
<div class="facts"><span>Liquidez bloqueada para siempre</span><span>100 % al pool</span><span>Creador: 0 tokens gratis</span><span>1 % de comisión</span></div>
<div class="who" id="rcp" hidden>Cobran las comisiones, para siempre: <span id="rl"></span></div>
<div id="info"></div>
<div class="red" id="real" hidden>Red real · dinero real</div>
<div style="width:100%">
<a class="btn" id="gh" target="_blank" rel="noopener" href="https://github.com/strvenjosue02-a11y/Vyron-pay-9"><svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>GitHub</a>
<button class="btn" id="go" hidden>Comprar</button>
<a class="btn" id="uni" target="_blank" rel="noopener" hidden>Comprar en Uniswap</a>
<div class="cap" id="cap">Revisa el código antes de comprar</div>
<a class="cap" id="src" target="_blank" rel="noopener" hidden href="https://github.com/strvenjosue02-a11y/Vyron-pay-9">Ver el código</a>
</div>
<p id="st"></p>
<p class="tiny">Sin llaves ni claves. Tú decides si firmas. Nada aquí promete ganancias.</p>
<script>
const TX=__TX__, INFO=__INFO__;
const found=[];addEventListener("eip6963:announceProvider",e=>found.push(e.detail.provider));dispatchEvent(new Event("eip6963:requestProvider"));
const eth=()=>window.ethereum||found[0];
const $=(i)=>document.getElementById(i);
$("t").textContent=INFO.name;$("sy").textContent="$"+INFO.symbol;$("addr").textContent=INFO.token;
if(INFO.image){$("img").src=INFO.image;$("img").hidden=false;$("av").hidden=true}else{$("av").textContent=(INFO.symbol||"?").charAt(0).toUpperCase();$("img").remove()}
$("lz").textContent=INFO.chain+" · Lazy: el token se crea con "+(INFO.openBuyer?"la primera compra":"esta firma");
$("go").textContent=INFO.openBuyer?"Comprar "+INFO.symbol:"Firmar lanzamiento";
if(INFO.openBuyer)$("info").innerHTML="<b>Compra inicial abierta:</b> pagas "+INFO.buyEth+" ETH y recibes los tokens; tu compra crea el token.";
$("real").hidden=!INFO.real;
$("cp").onclick=()=>{try{navigator.clipboard.writeText(INFO.token);$("cp").textContent="Copiado"}catch(e){}};
const st=$("st"),go=$("go"),gh=$("gh");
const expired=!!(INFO.deadline&&Date.now()/1000>INFO.deadline);
if(INFO.recipients&&INFO.recipients.length){$("rcp").hidden=false;const rl=$("rl");INFO.recipients.forEach((r,i)=>{const c=document.createElement("code");c.textContent=r.address;rl.append((i?" · ":"")+r.role+" "+r.pct+" % ",c)})}
let seen=false;try{seen=sessionStorage.getItem("seen")==="1"}catch(e){}
function reveal(){if(!seen||INFO.launched)return;gh.hidden=true;go.hidden=false;$("cap").textContent="Código revisado · puedes comprar";go.disabled=expired}
gh.onclick=()=>{seen=true;try{sessionStorage.setItem("seen","1")}catch(e){}};
for(const ev of["focus","pageshow","visibilitychange"])window.addEventListener(ev,()=>{if(ev!=="visibilitychange"||!document.hidden)reveal()});
function showLaunched(){for(const i of["gh","go","info","real","rcp","cap"])$(i).hidden=true;$("uni").href=INFO.buyUrl;$("uni").hidden=false;$("src").hidden=false;$("lz").textContent=INFO.chain+" · El token ya existe";st.textContent=""}
if(INFO.launched)showLaunched();else reveal();
if(expired&&!INFO.launched)st.textContent="Este plan venció (cada plan tiene un plazo). Pídele a Claude que genere uno nuevo.";
go.onclick=async()=>{try{
  if(!eth()){st.textContent="No encuentro una billetera en este navegador. Abre esta página dentro de tu billetera o instala MetaMask/Rabby.";return}
  const [from]=await eth().request({method:"eth_requestAccounts"});
  const hex="0x"+TX.chainId.toString(16);
  if((await eth().request({method:"eth_chainId"}))!==hex){try{await eth().request({method:"wallet_switchEthereumChain",params:[{chainId:hex}]})}catch(e){st.textContent="Cambia tu billetera a "+INFO.chain+" y vuelve a intentar.";return}}
  try{const code=await eth().request({method:"eth_getCode",params:[INFO.token,"latest"]});if(code&&code!=="0x"){showLaunched();return}}catch(e){}
  let data=TX.data;
  if(INFO.openBuyer){const parts=data.toLowerCase().split(INFO.openBuyer);if(parts.length!==2||!/^0x[0-9a-fA-F]{40}$/.test(from)){st.textContent="El plan no tiene el formato esperado: no se envió nada.";return}data=parts.join(from.slice(2).toLowerCase());st.textContent="Los tokens de la compra inicial irán a "+from+". "}
  st.textContent+="Esperando tu firma…";
  const h=await eth().request({method:"eth_sendTransaction",params:[{from,to:TX.to,value:"0x"+BigInt(TX.value).toString(16),data:data,...(TX.gas?{gas:"0x"+BigInt(TX.gas).toString(16)}:{})}]});
  st.innerHTML="Enviado: <a href='"+INFO.explorer+"/tx/"+h+"' target='_blank' rel='noopener' style='color:var(--ac)'>ver transacción</a>. Cuando se confirme, el token ya existe en Uniswap.";
}catch(e){st.textContent=e.code===4001?"Cancelaste la firma. No se envió nada.":"No se envió: "+(e.message||e)}};
</script></main></body></html>
