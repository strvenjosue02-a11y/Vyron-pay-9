<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0E0D">
<title>Cabaña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= Paletas ================= */
:root, [data-paleta="brasa"] {
  --bg: #0F0E0D; --raise: #181614; --ink: #EFE8DC; --muted: #A89F91; --acc: #E2A15A; --on-acc: #1A1008;
  --line: rgba(239, 232, 220, .16); --ok: #9BD08A; --busy: rgba(239, 232, 220, .1); --hero-end: #0F0E0D;
}
[data-paleta="bosque"] {
  --bg: #0B1510; --raise: #122019; --ink: #E7EEE2; --muted: #9DB09F; --acc: #A8CC83; --on-acc: #0E1A10;
  --line: rgba(231, 238, 226, .16); --ok: #A8D98E; --busy: rgba(231, 238, 226, .1); --hero-end: #0B1510;
}
[data-paleta="medianoche"] {
  --bg: #0B111C; --raise: #121A29; --ink: #E6ECF5; --muted: #99A7BE; --acc: #9BBEFF; --on-acc: #0A1224;
  --line: rgba(230, 236, 245, .16); --ok: #93D9A4; --busy: rgba(230, 236, 245, .1); --hero-end: #0B111C;
}
[data-paleta="niebla"] {
  --bg: #E3E6E2; --raise: #EEF0ED; --ink: #151A17; --muted: #4E5953; --acc: #2B5A46; --on-acc: #FFFFFF;
  --line: rgba(21, 26, 23, .18); --ok: #1F6B3A; --busy: rgba(21, 26, 23, .1); --hero-end: #0B0A09;
}

/* ================= Base ================= */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 72px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Hanken Grotesk", system-ui, sans-serif; font-size: 17px; line-height: 1.6;
  transition: background-color .7s ease, color .7s ease; -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; }
.disp, h1, h2, h3 { font-family: "Big Shoulders Display", Impact, sans-serif; text-transform: uppercase; letter-spacing: .005em; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
.col { max-width: 640px; }

.switch { display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; }
.switch button { padding: 10px 7px; color: var(--muted); min-height: 44px; min-width: 32px; }
.switch button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--acc); text-decoration-thickness: 2px; text-underline-offset: 7px; }
.switch i { width: 1px; height: 14px; background: var(--line); margin: 0 6px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 54px; padding: 0 28px;
  border: 1.5px solid var(--acc); color: var(--ink); text-decoration: none; font-size: 15.5px; font-weight: 700; letter-spacing: .02em;
  transition: background-color .25s, color .25s; border-radius: 2px;
}
.btn:hover { background: color-mix(in srgb, var(--acc) 16%, transparent); }
.btn.solid { background: var(--acc); color: var(--on-acc); }
.btn.solid:hover { background: color-mix(in srgb, var(--acc) 88%, var(--ink)); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.link { color: var(--acc); font-weight: 700; text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1.5px; padding: 6px 0; display: inline-block; }

.sec { font-weight: 900; font-size: clamp(54px, 14vw, 104px); line-height: .88; margin: 0 0 30px; }

/* Números que ruedan */
.roll { display: inline-flex; align-items: flex-start; height: 1.25em; line-height: 1.25em; overflow: hidden; vertical-align: bottom; font-variant-numeric: tabular-nums lining-nums; }
.roll .c { display: inline-block; height: 1.25em; overflow: hidden; }
.roll .s { display: flex; flex-direction: column; transition: transform .75s cubic-bezier(.2,.8,.2,1); }
.roll .s span, .roll .t { display: block; height: 1.25em; }
.roll .sp { width: .22em; }
.roll .cm { margin-left: -.16em; }

/* ================= Portada: la foto manda ================= */
.hero {
  --ink: #F4EEE3; --muted: #D3C9BB; --line: rgba(244, 238, 227, .32);
  position: relative; min-height: 100svh; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
  padding: 0 20px 34px; background: #0B0A09; color: var(--ink);
}
.hero-photo { position: absolute; inset: 0; z-index: 0; }
.hero-photo img { position: absolute; left: 0; top: -6%; width: 100%; height: 112%; object-fit: cover; object-position: 50% 62%; will-change: transform; transform: translateY(var(--py, 0px)); }
.hero-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,7,6,.62) 0%, rgba(8,7,6,.12) 26%, rgba(8,7,6,.35) 52%, rgba(8,7,6,.86) 82%, var(--hero-end) 100%); }
.fog { position: absolute; width: 140%; height: 38%; left: -20%; border-radius: 50%; background: radial-gradient(closest-side, rgba(230, 236, 238, .2), transparent 72%); filter: blur(28px); opacity: .6; z-index: 1; }
.fog.f1 { top: 22%; } .fog.f2 { top: 46%; opacity: .45; }
.hero-top, .hero-body { position: relative; z-index: 2; max-width: 1080px; width: 100%; margin: 0 auto; }
.hero-top { display: flex; justify-content: space-between; align-items: center; padding-top: env(safe-area-inset-top); gap: 8px; }
.mark { font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
.hero-ctrl { display: flex; align-items: center; gap: 6px; }
.chip-top { font-size: 13.5px; font-weight: 700; border: 1px solid var(--line); padding: 0 12px; min-height: 34px; display: inline-flex; align-items: center; border-radius: 2px; }
.loc { margin: 0 0 14px; font-size: 14.5px; font-weight: 600; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.name { margin: 0; font-weight: 900; font-size: clamp(88px, 28vw, 250px); line-height: .86; }
.name span { display: block; }
.lema { font-size: clamp(19px, 4.8vw, 25px); line-height: 1.3; margin: 22px 0 0; max-width: 24ch; font-weight: 500; text-wrap: balance; }
.status { margin: 18px 0 0; display: inline-flex; align-items: center; gap: 10px; font-size: 14.5px; color: var(--muted); font-weight: 600; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.status.free i { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent); }
.cta { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
@media (min-width: 900px) {
  .hero { padding-bottom: 56px; background: var(--hero-end); }
  .hero-photo { left: auto; right: 0; width: min(52vw, 760px); }
  .hero-photo::after { background: linear-gradient(90deg, var(--hero-end) 0%, rgba(8,7,6,.1) 38%), linear-gradient(180deg, rgba(8,7,6,.5) 0%, rgba(8,7,6,0) 22%, rgba(8,7,6,0) 70%, var(--hero-end) 100%); }
  .name { font-size: clamp(120px, 15vw, 250px); }
  .lema { max-width: 28ch; }
}
@media (prefers-reduced-motion: no-preference) {
  .fog.f1 { animation: drift 38s ease-in-out infinite alternate; }
  .fog.f2 { animation: drift 52s ease-in-out infinite alternate-reverse; }
  .name span { animation: rise 1.1s cubic-bezier(.2,.7,.2,1) both; } .name span + span { animation-delay: .12s; }
  .lema, .status, .cta, .loc { animation: fade 1.1s ease .5s both; }
  @keyframes drift { from { transform: translateX(-7%); } to { transform: translateX(7%); } }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
}

/* ================= Barra fija ================= */
.bar {
  position: fixed; inset: 0 0 auto 0; z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line);
  transform: translateY(-100%); transition: transform .45s cubic-bezier(.2,.7,.2,1), background-color .7s; visibility: hidden;
}
.bar.show { transform: none; visibility: visible; }
.bar-in { max-width: 1080px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; gap: 18px; height: 60px; }
.bar .nm { font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: .04em; text-transform: uppercase; text-decoration: none; flex: none; }
.bar nav { flex: 1; display: flex; gap: 24px; justify-content: center; }
.bar nav a { font-size: 15px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 8px 0; border-bottom: 2px solid transparent; white-space: nowrap; }
.bar nav a.on { color: var(--ink); border-color: var(--acc); }
@media (max-width: 900px) { .bar nav { display: none; } .bar-in { justify-content: space-between; } }

/* ================= La cabaña ================= */
section.blk { padding-top: 110px; }
.intro { font-size: clamp(22px, 5.4vw, 30px); line-height: 1.38; font-weight: 500; margin: 0; max-width: 28ch; }
.ficha { margin: 40px 0 0; display: grid; border-top: 1px solid var(--line); }
.ficha div { display: grid; grid-template-columns: 38% 1fr; gap: 14px; padding: 15px 0; border-bottom: 1px solid var(--line); }
.ficha dt { color: var(--muted); font-weight: 600; font-size: 15px; }
.ficha dd { margin: 0; font-weight: 500; }
@media (min-width: 900px) { .cabin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: start; } .ficha { margin-top: 0; } }
.facts-line { margin: 30px 0 0; display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--muted); font-weight: 600; font-size: 14.5px; }

/* ================= Por dentro ================= */
.inside { display: grid; gap: 40px; }
.inside figure { margin: 0 -20px; }
.inside figure img { display: block; width: 100%; height: auto; }
.inside figcaption { color: var(--muted); font-size: 14px; font-weight: 600; margin: 10px 20px 0; }
@media (min-width: 900px) { .inside { grid-template-columns: 430px 1fr; gap: 80px; align-items: start; } .inside figure { margin: 0; position: sticky; top: 90px; } .inside figcaption { margin: 10px 0 0; } }
.hl { padding: 22px 0; border-top: 1px solid var(--line); }
.hl:last-child { border-bottom: 1px solid var(--line); }
.hl h3 { font-weight: 800; font-size: clamp(34px, 8.5vw, 52px); line-height: .95; margin: 0 0 8px; }
.hl p { margin: 0; color: var(--muted); max-width: 40ch; }
.mosaic { margin-top: 60px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.m { margin: 0; position: relative; overflow: hidden; background: #111; aspect-ratio: 1 / 1; }
.m img { display: block; width: 100%; height: 100%; object-fit: cover; }
.m.wide { grid-column: 1 / -1; aspect-ratio: 5 / 2; }
.m.tall { aspect-ratio: 3 / 4; }
.m figcaption { position: absolute; left: 12px; bottom: 10px; margin: 0; color: #F4EEE3; font-size: 14px; font-weight: 600; text-shadow: 0 1px 8px rgba(0,0,0,.7); }

/* ================= Reservar ================= */
.direct { color: var(--acc); font-weight: 700; margin: 0 0 6px; }
.cancel { color: var(--muted); font-size: 15px; margin: 0 0 30px; max-width: 52ch; }
.cal { text-align: left; }
.cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.cal-head button { width: 46px; height: 46px; border: 1px solid var(--line); color: var(--ink); font-size: 18px; border-radius: 2px; }
.cal-head button[disabled] { opacity: .3; pointer-events: none; }
.cal-head .hint { font-size: 14.5px; color: var(--muted); font-weight: 600; text-align: center; flex: 1; padding: 0 8px; }
.months { display: grid; gap: 30px; }
@media (min-width: 760px) { .months { grid-template-columns: 1fr 1fr; gap: 44px; } }
.month h4 { font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 800; font-size: 28px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .02em; }
.dow, .days { display: grid; grid-template-columns: repeat(7, 1fr); }
.dow span { text-align: center; font-size: 12.5px; color: var(--muted); font-weight: 700; padding: 6px 0; }
.day { aspect-ratio: 1; min-height: 44px; margin: 1px 0; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; border-radius: 4px; position: relative; }
.day.empty { visibility: hidden; pointer-events: none; }
.day:disabled { color: var(--muted); opacity: .5; cursor: not-allowed; }
.day.busy:disabled { text-decoration: line-through; background: var(--busy); opacity: .55; }
.day.today { box-shadow: inset 0 0 0 1px var(--line); }
.day.inr { background: color-mix(in srgb, var(--acc) 24%, transparent); border-radius: 0; }
.day.s, .day.e { background: var(--acc); color: var(--on-acc); border-radius: 4px; opacity: 1; }
.legend { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 12px; font-weight: 600; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.book-grid { display: grid; gap: 30px; margin-top: 34px; }
@media (min-width: 900px) { .book-grid { grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; } .book-grid .cal-col { grid-column: 1 / -1; } }
form.book { display: grid; gap: 18px; text-align: left; }
.picked { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.picked div { padding: 12px 14px; border: 1px solid var(--line); background: var(--raise); border-radius: 2px; transition: background-color .7s; }
.picked small { display: block; font-size: 13px; color: var(--muted); font-weight: 700; }
.picked b { font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 800; font-size: 26px; text-transform: uppercase; line-height: 1.1; }
.hint2 { font-size: 14.5px; min-height: 20px; margin: 0; color: var(--muted); font-weight: 600; }
.hint2.bad { color: var(--acc); }
.field label, .field .lbl { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
.field input, .field textarea { width: 100%; min-height: 52px; padding: 12px 14px; background: var(--raise); border: 1px solid var(--line); border-radius: 2px; font-size: 16px; transition: border-color .2s, background-color .7s; }
.field input:focus, .field textarea:focus { border-color: var(--acc); outline: none; }
.field textarea { min-height: 84px; resize: vertical; }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); background: var(--raise); min-height: 52px; border-radius: 2px; }
.stepper button { width: 52px; height: 52px; font-size: 22px; color: var(--acc); flex: none; }
.stepper output { flex: 1; text-align: center; font-size: 17px; font-weight: 700; }
.extras .lbl { display: block; font-size: 14px; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
.check { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 16px; border: 1px solid var(--line); border-radius: 2px; cursor: pointer; font-size: 15.5px; }
.check .l { display: flex; gap: 12px; align-items: center; }
.check input { width: 22px; height: 22px; accent-color: var(--acc); flex: none; }
.check .pr { color: var(--acc); font-weight: 700; white-space: nowrap; }
.quote { border: 1px solid var(--line); padding: 18px; background: var(--raise); border-radius: 2px; transition: background-color .7s; }
.quote .empty { color: var(--muted); margin: 0; font-weight: 600; }
.q-row { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.q-row span:first-child { color: var(--muted); }
.q-row.disc span:last-child { color: var(--ok); font-weight: 700; }
.q-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; }
.q-total span { color: var(--muted); font-weight: 700; }
.q-total b { font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 900; font-size: 52px; line-height: 1; }
.q-save { margin: 8px 0 0; color: var(--ok); font-weight: 700; font-size: 14.5px; text-align: right; }
form.book .btn { width: 100%; }
.fine { font-size: 13.5px; color: var(--muted); margin: 2px 0 0; }

/* ================= Antes de llegar ================= */
.arrive { display: grid; gap: 28px; }
@media (min-width: 900px) { .arrive { grid-template-columns: 1fr 1fr; gap: 28px 60px; } }
.g-card { border-top: 2px solid var(--ink); padding-top: 14px; }
.g-card h3 { font-weight: 800; font-size: 32px; margin: 0 0 8px; line-height: 1; }
.g-times { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.g-times small { color: var(--muted); font-weight: 700; font-size: 13px; display: block; }
.g-times b { font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 800; font-size: 40px; line-height: 1; }
.g-list { list-style: none; margin: 0; padding: 0; }
.g-list li { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15.5px; }
.g-list li:last-child { border-bottom: 0; }
.g-list li span:last-child { color: var(--muted); text-align: right; }
.g-list.single li { justify-content: flex-start; }
.g-list.single li span:last-child { color: var(--ink); text-align: left; }
.wifi { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.wifi small { display: block; color: var(--muted); font-size: 13.5px; }
.wifi .btn { min-height: 44px; padding: 0 18px; font-size: 14.5px; flex: none; }
.maps { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; }

/* ================= Preguntas ================= */
details { border-top: 1px solid var(--line); }
details:last-child { border-bottom: 1px solid var(--line); }
summary { list-style: none; cursor: pointer; padding: 20px 0; display: flex; justify-content: space-between; gap: 18px; align-items: center; font-weight: 700; font-size: 18px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-size: 26px; font-weight: 500; color: var(--acc); transition: transform .25s; line-height: 1; }
details[open] summary::after { transform: rotate(45deg); }
details p { margin: 0 0 22px; color: var(--muted); max-width: 56ch; }

/* ================= Reseñas ================= */
.rev-top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 26px; }
.score { font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 900; font-size: 92px; line-height: .85; }
.stars { display: inline-flex; gap: 4px; color: var(--acc); }
.stars svg { width: 18px; height: 18px; fill: currentColor; }
.count { color: var(--muted); font-size: 14.5px; margin: 6px 0 0; font-weight: 600; }
.quotes { display: grid; gap: 14px; }
@media (min-width: 900px) { .quotes { grid-template-columns: 1fr 1fr 1fr; } }
.rq { margin: 0; padding: 22px; border: 1px solid var(--line); background: var(--raise); border-radius: 2px; transition: background-color .7s; }
.rq p { font-size: 18px; line-height: 1.45; margin: 0; font-weight: 500; }
.rq cite { display: block; font-style: normal; color: var(--muted); font-size: 14.5px; margin-top: 14px; font-weight: 600; }
.host { margin: 0; max-width: 46ch; color: var(--muted); }
.host cite { display: block; font-style: normal; color: var(--ink); font-weight: 700; margin-top: 8px; }
.contact { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 18px; }
footer { margin-top: 100px; border-top: 1px solid var(--line); padding: 30px 20px 128px; text-align: center; color: var(--muted); font-size: 14px; }
footer p { margin: 0 auto 6px; max-width: 56ch; }
footer button { color: var(--acc); text-decoration: underline; text-underline-offset: 4px; font-weight: 700; padding: 8px; margin-bottom: 10px; font-size: 15.5px; }

/* ================= Botones flotantes ================= */
.dock { position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 25; transform: translateY(160%); transition: transform .4s cubic-bezier(.2,.7,.2,1); }
.dock.show { transform: none; }
.dock .btn { box-shadow: 0 12px 36px rgba(0,0,0,.4); min-height: 52px; }
.demo-btn { position: fixed; left: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 30; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 12px; min-height: 52px; background: var(--ink); color: var(--bg); border-radius: 2px; font-size: 14.5px; font-weight: 700; box-shadow: 0 12px 36px rgba(0,0,0,.4); transform: translateY(160%); transition: transform .4s cubic-bezier(.2,.7,.2,1), background-color .7s, color .7s; }
.demo-btn.show { transform: none; }
.dots { display: flex; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--bg); margin-left: -4px; }
.dots i:first-child { margin-left: 0; }

/* ================= Paneles ================= */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .3s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; max-width: 540px; margin: 0 auto; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-bottom: 0; padding: 28px 22px calc(26px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .4s cubic-bezier(.2,.8,.2,1), background-color .7s, visibility 0s .4s; max-height: 90svh; overflow-y: auto; visibility: hidden; }
.sheet.on { transform: none; visibility: visible; transition: transform .4s cubic-bezier(.2,.8,.2,1), background-color .7s; }
.sheet h2 { font-weight: 900; font-size: 44px; line-height: .9; margin: 0 0 8px; padding-right: 40px; }

    return '<span class="roll" role="text" aria-label="' + esc(txt) + '">' + chars.map((ch, i) => {
      if (!/\d/.test(ch)) return '<span class="t' + (ch === " " ? " sp" : "") + (ch === "," ? " cm" : "") + '" aria-hidden="true">' + (ch === " " ? "" : esc(ch)) + "</span>";
      const p = prev ? prev[i + off] : null, old = prev ? (/\d/.test(p || "") ? p : "0") : ch;
      return '<span class="c" aria-hidden="true"><span class="s" data-to="' + ch + '" style="transform:translateY(' + (-old * 1.25) + 'em)">' + "0123456789".split("").map((d) => "<span>" + d + "</span>").join("") + "</span></span>";
    }).join("") + "</span>";
  };
  function setUsd(el, usd, fromTxt) {
    el.dataset.usd = usd; el.innerHTML = roll(usdTxt(usd), fromTxt);
    if (fromTxt) requestAnimationFrame(() => requestAnimationFrame(() => el.querySelectorAll(".s").forEach((s) => { s.style.transform = "translateY(" + (-s.dataset.to * 1.25) + "em)"; })));
  }
  function rollAll(prevCur) { $$("[data-usd]").forEach((el) => setUsd(el, Number(el.dataset.usd), usdTxt(Number(el.dataset.usd), prevCur))); }

  /* ---------- Hoja de Google opcional ---------- */
  function loadSheet() {
    if (!R.hojaGoogle) return;
    fetch(R.hojaGoogle, { cache: "no-store" }).then((r) => r.ok ? r.text() : "").then((csv) => {
      if (!csv) return;
      const rows = csv.trim().split(/\r?\n/).map((l) => l.split(",").map((c) => c.trim().replace(/^"|"$/g, "")));
      const head = rows.shift().map((h) => h.toLowerCase()), i1 = head.indexOf("inicio"), i2 = head.indexOf("fin"); if (i1 < 0 || i2 < 0) return;
      ranges = rows.filter((r) => /^\d{4}-\d{2}-\d{2}$/.test(r[i1]) && /^\d{4}-\d{2}-\d{2}$/.test(r[i2])).map((r) => [r[i1], r[i2]]);
      buildBooked(); renderCal(); renderStatus();
    }).catch(() => {});
  }

  /* ---------- Paleta ---------- */
  function applyPaleta() {
    document.documentElement.setAttribute("data-paleta", paleta);
    $('meta[name="theme-color"]').content = PALETAS[paleta].bg;
    $$(".pal").forEach((b) => b.setAttribute("aria-pressed", b.dataset.p === paleta));
  }

  /* ---------- Disponibilidad hoy ---------- */
  function renderStatus() {
    const t0 = today(); let txt, free;
    if (!booked.has(t0)) { free = true; let d = t0, i = 0; while (i < 400 && !booked.has(d)) { d = addDays(d, 1); i++; } txt = i < 400 ? L().availNext(fmtD(d)) : L().avail; }
    else { free = false; let d = t0; while (booked.has(d)) d = addDays(d, 1); txt = L().busyUntil(fmtD(d)); }
    $("#availState").classList.toggle("free", free); $("#availState em").textContent = txt;
  }

  /* ---------- Calendario ---------- */
  const monthDays = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  function renderCal() {
    const n = manyMonths ? 2 : 1, mo = []; let y = viewY, m = viewM;
    const dows = lang === "es" ? ["L", "M", "M", "J", "V", "S", "D"] : ["M", "T", "W", "T", "F", "S", "S"];
    for (let k = 0; k < n; k++) {
      const first = (new Date(Date.UTC(y, m, 1)).getUTCDay() + 6) % 7, nd = monthDays(y, m); let cells = "";
      for (let i = 0; i < first; i++) cells += '<button type="button" class="day empty" disabled tabindex="-1"></button>';
      for (let d = 1; d <= nd; d++) {
        const iso = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
        const isFree = freeNight(iso), canEnd = selIn && !selOut && iso > selIn && rangeFree(selIn, iso);
        let cls = "day"; if (booked.has(iso)) cls += " busy"; if (iso === today()) cls += " today";
        if (selIn && selOut && iso > selIn && iso < selOut) cls += " inr"; if (iso === selIn) cls += " s"; if (iso === selOut) cls += " e";
        cells += '<button type="button" class="' + cls + '" data-d="' + iso + '"' + (!(isFree || canEnd) ? " disabled" : "") + ' aria-label="' + esc(fmtD(iso, { day: "numeric", month: "long", year: "numeric" })) + '">' + d + "</button>";
      }
      const title = new Date(Date.UTC(y, m, 1)).toLocaleDateString(lang === "es" ? "es-CR" : "en-US", { month: "long", year: "numeric", timeZone: "UTC" });
      mo.push('<div class="month"><h4>' + esc(title) + '</h4><div class="dow">' + dows.map((x) => "<span>" + x + "</span>").join("") + '</div><div class="days">' + cells + "</div></div>");
      m++; if (m > 11) { m = 0; y++; }
    }
    $("#months").innerHTML = mo.join("");
    const cy = +today().slice(0, 4), cm = +today().slice(5, 7) - 1;
    $("#calPrev").disabled = viewY < cy || (viewY === cy && viewM <= cm);
    $("#calHint").textContent = !selIn ? L().pickIn : !selOut ? L().pickOut : "";
    renderPicked(); renderQuote();
  }
  function onDay(iso) {
    if (selIn && selOut && iso > selOut && diff(selIn, selOut) < R.minNoches && rangeFree(selIn, iso)) selOut = iso;
    else if (!selIn || (selIn && selOut)) { if (freeNight(iso)) { selIn = iso; selOut = null; } }
    else if (iso <= selIn) { if (freeNight(iso)) { selIn = iso; selOut = null; } }
    else if (rangeFree(selIn, iso)) selOut = iso;
    else if (freeNight(iso)) { selIn = iso; selOut = null; }
    renderCal();
  }
  function renderPicked() {
    $("#pIn").textContent = selIn ? fmtD(selIn, { weekday: "short", day: "numeric", month: "short" }) : "—";
    $("#pOut").textContent = selOut ? fmtD(selOut, { weekday: "short", day: "numeric", month: "short" }) : "—";
    const h = $("#dateHint"), n = selIn && selOut ? diff(selIn, selOut) : 0;
    if (selIn && selOut && n < R.minNoches) { h.textContent = L().minN(R.minNoches); h.classList.add("bad"); } else { h.textContent = ""; h.classList.remove("bad"); }
  }

  /* ---------- Cotizador ---------- */
  function computeQuote() {
    if (!selIn || !selOut) return null;
    const n = diff(selIn, selOut), groups = {}; let lodging = 0;
    for (let d = selIn; d < selOut; d = addDays(d, 1)) { const tf = rateFor(d); groups[tf.id] = groups[tf.id] || { tf, n: 0 }; groups[tf.id].n++; lodging += tf.noche; }
    const disc = Math.round(lodging * (R.descuentoDirecto || 0) / 100), clean = R.limpieza || 0;
    let ex = 0; const exl = R.extras.filter((e) => picked.has(e.id)); exl.forEach((e) => { ex += e.precio; });
    const sub = lodging - disc + clean + ex, tax = Math.round(sub * (R.impuesto || 0));
    return { n, groups: Object.values(groups), lodging, disc, clean, exl, tax, total: sub + tax };
  }
  function renderQuote() {
    const box = $("#quote"), qd = computeQuote();
    if (!qd) { box.innerHTML = '<p class="empty">' + L().pickDates + "</p>"; return; }
    let h = "";
    qd.groups.forEach((g) => { h += '<div class="q-row"><span>' + esc(t(g.tf.nombre)) + " · " + L().nights(g.n) + " × " + usdTxt(g.tf.noche) + '</span><span data-usd="' + g.tf.noche * g.n + '"></span></div>'; });
    if (qd.disc) h += '<div class="q-row disc"><span>' + L().disc(R.descuentoDirecto) + '</span><span data-usd="' + (-qd.disc) + '"></span></div>';
    if (qd.clean) h += '<div class="q-row"><span>' + L().clean + '</span><span data-usd="' + qd.clean + '"></span></div>';
    qd.exl.forEach((e) => { h += '<div class="q-row"><span>' + esc(t(e.nombre)) + '</span><span data-usd="' + e.precio + '"></span></div>'; });
    h += '<div class="q-row"><span>' + L().tax(Math.round((R.impuesto || 0) * 100)) + '</span><span data-usd="' + qd.tax + '"></span></div>';
    h += '<div class="q-total"><span>' + L().total + '</span><b data-usd="' + qd.total + '"></b></div>';
    if (qd.disc) h += '<p class="q-save" id="saveTxt"></p>';
    box.innerHTML = h; box.querySelectorAll("[data-usd]").forEach((el) => setUsd(el, Number(el.dataset.usd)));
    if (qd.disc) $("#saveTxt").textContent = L().save(usdTxt(qd.disc));
  }
  $("#gMinus").onclick = () => { guests = Math.max(1, guests - 1); $("#guests").textContent = guests; };
  $("#gPlus").onclick = () => { guests = Math.min(R.maxHuespedes, guests + 1); $("#guests").textContent = guests; };
  $("#calPrev").onclick = () => { viewM--; if (viewM < 0) { viewM = 11; viewY--; } renderCal(); };
  $("#calNext").onclick = () => { viewM++; if (viewM > 11) { viewM = 0; viewY++; } renderCal(); };
  $("#months").addEventListener("click", (e) => { const b = e.target.closest(".day[data-d]"); if (b && !b.disabled) onDay(b.dataset.d); });
  $("#extras").addEventListener("change", (e) => { const c = e.target.closest("input[data-x]"); if (!c) return; c.checked ? picked.add(c.dataset.x) : picked.delete(c.dataset.x); renderQuote(); });
  matchMedia("(min-width: 760px)").addEventListener("change", (e) => { manyMonths = e.matches; renderCal(); });
  $("#book").addEventListener("submit", (e) => {
    e.preventDefault(); const h = $("#dateHint");
    if (!selIn || !selOut) { h.textContent = L().pickDates; h.classList.add("bad"); return; }
    const qd = computeQuote(); if (qd.n < R.minNoches) { h.textContent = L().minN(R.minNoches); h.classList.add("bad"); return; }
    if (!$("#fName").value.trim()) { h.textContent = L().nameMissing; h.classList.add("bad"); $("#fName").focus(); return; }
    const M = L().msg, f = (d) => fmtD(d, { weekday: "short", day: "numeric", month: "long", year: "numeric" });
    const lines = [M.hi + R.nombre + ".", "", M.dates + ": " + f(selIn) + " → " + f(selOut), M.nights + ": " + qd.n, M.guests + ": " + guests];
    if (qd.exl.length) lines.push(M.extras + ": " + qd.exl.map((x) => t(x.nombre)).join(", "));
    lines.push(M.total + ": " + usdTxt(qd.total, "usd") + " (" + M.direct + ")", M.name + ": " + $("#fName").value.trim());
    if ($("#fNotes").value.trim()) lines.push(M.notes + ": " + $("#fNotes").value.trim());
    window.open("https://wa.me/" + R.whatsapp + "?text=" + encodeURIComponent(lines.join("\n")), "_blank", "noopener");
  });

  /* ---------- Encuesta de salida ---------- */
  function renderSurvey() {
    $("#rates").innerHTML = L().svItems.map((n, i) => '<div class="rate"><div class="lbl">' + n + '</div><div class="st" role="group" aria-label="' + n + '">' +
      [1, 2, 3, 4, 5].map((v) => '<button type="button" data-rate="' + i + '" data-v="' + v + '" class="' + (rates[i] >= v ? "on" : "") + '" aria-label="' + v + ' / 5">' + STAR + "</button>").join("") + "</div></div>").join("");
    $("#svNext").disabled = rates.some((r) => !r);
    $("#svChips").innerHTML = L().svChips.map((c, i) => '<button type="button" class="chip" data-svc="' + i + '" aria-pressed="' + badChips.has(i) + '">' + c + "</button>").join("");
    $("#svGoogle").href = R.resenaUrl;
  }
  const svStep = (id) => { ["sv1", "svGood", "svBad", "svDone"].forEach((s) => { $("#" + s).hidden = s !== id; }); };

  /* ---------- Paneles ---------- */
  let openSheet = null, lastFocus = null;
  function open(id) { close(true); openSheet = $(id); lastFocus = document.activeElement; openSheet.classList.add("on"); $("#scrim").classList.add("on"); const x = openSheet.querySelector(".x"); if (x) x.focus({ preventScroll: true }); }
  function close(silent) { if (!openSheet) return; openSheet.classList.remove("on"); $("#scrim").classList.remove("on"); openSheet = null; if (!silent && lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true }); }
  $("#scrim").onclick = () => close();
  addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });

  /* ---------- Contenido ---------- */
  function renderAll() {
    document.documentElement.lang = lang;
    document.title = R.nombre + (lang === "es" ? ", reservá directo" : ", book direct");
    $$("[data-t]").forEach((el) => { el.textContent = L()[el.dataset.t]; });
    $("#mark").textContent = R.nombre; $("#barName").textContent = R.nombre;
    $("#name").innerHTML = R.nombre.split(" ").map((w) => "<span>" + esc(w) + "</span>").join("");
    $("#loc").textContent = t(R.lugar); $("#alt").textContent = t(R.altura); $("#lema").textContent = t(R.lema);
    $("#heroImg").src = R.fotos.exterior;
    $("#intro").textContent = t(R.intro); $("#factsLine").innerHTML = "<span>" + esc(R.coords) + "</span><span>" + esc(t(R.altura)) + "</span>";
    $("#ficha").innerHTML = R.ficha.map((f) => "<div><dt>" + esc(t(f.k)) + "</dt><dd>" + esc(t(f.v)) + "</dd></div>").join("");
    $("#barNav").innerHTML = [["cabana", L().cabinTitle], ["por-dentro", L().insideTitle], ["reservar", L().bookTitle], ["llegar", L().arriveTitle], ["preguntas", L().faqTitle]].map(([id, n]) => '<a href="#' + id + '" data-id="' + id + '">' + esc(n) + "</a>").join("");
    $("#intImg").src = R.fotos.interior; $("#intCap").textContent = R.destacados[2] ? t(R.destacados[2].t) : "";
    $("#hls").innerHTML = R.destacados.map((h) => '<div class="hl"><h3>' + esc(t(h.t)) + "</h3><p>" + esc(t(h.d)) + "</p></div>").join("");
    $("#mosaic").innerHTML = R.fotos.detalles.map((d) => '<figure class="m ' + (d.cls || "") + '"><img src="' + d.src + '" alt="" loading="lazy" decoding="async"><figcaption>' + esc(t(d.cap)) + "</figcaption></figure>").join("");
    $("#directNote").textContent = R.descuentoDirecto ? L().direct(R.descuentoDirecto) : ""; $("#cancelNote").textContent = R.cancelacion ? t(R.cancelacion) : "";
    $("#extras").innerHTML = R.extras.map((e) => '<label class="check"><span class="l"><input type="checkbox" data-x="' + e.id + '"' + (picked.has(e.id) ? " checked" : "") + "><span>" + esc(t(e.nombre)) + '</span></span><span class="pr" data-usd="' + e.precio + '"></span></label>').join("");
    $("#extras").querySelectorAll("[data-usd]").forEach((el) => setUsd(el, Number(el.dataset.usd)));
    $("#ciT").textContent = R.checkin; $("#coT").textContent = R.checkout;
    $("#llegarL").innerHTML = R.llegar.map((c) => "<li><span>" + esc(t(c)) + "</span><span>" + esc(t(c.dato)) + "</span></li>").join("");
    $("#llevarL").innerHTML = R.llevar.map((c) => "<li><span>" + esc(t(c)) + "</span></li>").join("");
    $("#cercaL").innerHTML = R.cerca.map((c) => "<li><span>" + esc(t(c)) + "</span><span>" + esc(t(c.dato)) + "</span></li>").join("");
    $("#rulesL").innerHTML = R.normas.map((c) => "<li><span>" + esc(t(c)) + "</span></li>").join("");
    $("#map").href = R.mapa; $("#waze").href = R.waze;
    $("#wifiBox").hidden = !R.wifi; if (R.wifi) $("#wifiName").textContent = R.wifi.red;
    $("#faq").innerHTML = R.faq.map((f) => "<details><summary>" + esc(t(f.q)) + "</summary><p>" + esc(t(f.a)) + "</p></details>").join("");
    const rv = R.resenas;
    $("#score").textContent = rv.nota.toLocaleString(lang === "es" ? "es-CR" : "en-US", { minimumFractionDigits: 1 });
    $("#stars").innerHTML = Array(5).fill(STAR).join(""); $("#count").textContent = L().reviews(rv.total);
    $("#quotes").innerHTML = rv.lista.map((r) => '<figure class="rq"><p>' + esc(t(r.texto)) + "</p><cite>" + esc(r.autor) + "</cite></figure>").join("");
    $("#revLink").href = R.resenaUrl;
    $("#hostTxt").textContent = t(R.anfitrion.nota); $("#hostName").textContent = R.anfitrion.nombre;
    $("#ig").textContent = "@" + R.instagram; $("#ig").href = "https://instagram.com/" + R.instagram;
    $("#taxes").textContent = L().taxes(Math.round((R.impuesto || 0) * 100));
    $$("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    $$("[data-cur]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.cur === cur));
    renderStatus(); renderCal(); renderSurvey(); observe();
  }

  /* ---------- Scroll ---------- */
  let io;
  function observe() {
    if (io) io.disconnect();
    io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) $$("#barNav a").forEach((a) => a.classList.toggle("on", a.dataset.id === e.target.id)); }), { rootMargin: "-45% 0px -50% 0px" });
    ["cabana", "por-dentro", "reservar", "llegar", "preguntas"].forEach((id) => io.observe(document.getElementById(id)));
  }
  const hero = $("#top"), bar = $("#bar"), dock = $("#dock"), resv = $("#reservar"), demoBtn = $("#demoOpen");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let ticking = false;
  function onScroll() {
    const y = scrollY, h = innerHeight, past = y > h * 0.8;
    bar.classList.toggle("show", past);
    const r = resv.getBoundingClientRect(), inRes = r.top < h && r.bottom > 0;
    dock.classList.toggle("show", past && innerWidth < 900 && !inRes);
    if (DEMO) demoBtn.classList.toggle("show", past);
    if (!still && y < h * 1.2) hero.style.setProperty("--py", (y * 0.14) + "px");
    ticking = false;
  }
  addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });

  /* ---------- Clics ---------- */
  function copyWifi() { const done = () => toast(L().wifiCopied); if (navigator.clipboard && R.wifi) navigator.clipboard.writeText(R.wifi.clave).then(done, done); else done(); }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.hasAttribute("data-close")) { close(); return; }
    if (b.dataset.lang) { lang = b.dataset.lang; store.set("villa-lang", lang); renderAll(); }
    else if (b.dataset.cur) {
      if (b.dataset.cur === cur) return; const prev = cur; cur = b.dataset.cur; store.set("villa-cur", cur);
      $$("[data-cur]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.cur === cur)); rollAll(prev);
      const sv = $("#saveTxt"); if (sv) { const qd = computeQuote(); if (qd) sv.textContent = L().save(usdTxt(qd.disc)); }
    }
    else if (b.id === "wifiCopy") copyWifi();
    else if (b.id === "topPal") open("#demoSheet");
    else if (b.id === "surveyOpen") { svStep("sv1"); open("#surveySheet"); }
    else if (b.dataset.rate) { rates[Number(b.dataset.rate)] = Number(b.dataset.v); renderSurvey(); }
    else if (b.id === "svNext") svStep(rates.reduce((a, c) => a + c, 0) / 3 >= 4 ? "svGood" : "svBad");
    else if (b.dataset.svc) { const i = Number(b.dataset.svc); badChips.has(i) ? badChips.delete(i) : badChips.add(i); renderSurvey(); }
    else if (b.id === "svSend") {
      const msg = [L().svMsg + R.nombre + ":", L().svItems.map((n, i) => n + " " + rates[i] + "/5").join(", ")];
      if (badChips.size) msg.push([...badChips].map((i) => L().svChips[i]).join(", ")); if ($("#svText").value.trim()) msg.push($("#svText").value.trim());
      window.open("https://wa.me/" + R.whatsapp + "?text=" + encodeURIComponent(msg.join("\n")), "_blank", "noopener"); svStep("svDone");
    }
    else if (b.dataset.p) { paleta = b.dataset.p; applyPaleta(); }
    else if (b.dataset.dl) { const c = document.querySelector("#" + b.dataset.dl + " canvas"); if (!c) return; const a = document.createElement("a"); a.download = b.dataset.dl + "-" + R.nombre.toLowerCase().replace(/\s+/g, "-") + ".png"; a.href = c.toDataURL("image/png"); a.click(); }
  });

  /* ---------- Panel de demo ---------- */
  if (DEMO) {
    $("#demo").hidden = false; $("#topPal").hidden = false;
    $("#pals").innerHTML = Object.entries(PALETAS).map(([k, v]) => '<button class="pal" type="button" data-p="' + k + '"><span class="sw" style="background:' + v.bg + ";--rim:" + v.rim + '"></span>' + v.nombre + "</button>").join("");
    demoBtn.onclick = () => open("#demoSheet");
    if (window.QRCode) {
      const base = location.href.split("?")[0].split("#")[0], opt = (text) => ({ text, width: 280, height: 280, colorDark: "#111111", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
      new QRCode($("#qrGuide"), opt(base + "?cliente=1#llegar")); new QRCode($("#qrSurvey"), opt(base + "?cliente=1&encuesta=1"));
    }
  }

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

  buildRanges(); buildBooked();
  const t0 = today(); viewY = +t0.slice(0, 4); viewM = +t0.slice(5, 7) - 1;
  renderAll(); applyPaleta(); onScroll(); loadSheet();
  if (q.get("encuesta") === "1") { svStep("sv1"); open("#surveySheet"); }
  setInterval(renderStatus, 60000);
})();
</script>
</body>
