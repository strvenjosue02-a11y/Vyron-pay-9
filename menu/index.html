<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ---------- Paletas ---------- */
:root, [data-paleta="bordeaux"] {
  --bg: #2A0E14; --ink: #F2E8DE; --muted: #BCA39B; --metal: #D9BF8C;
  --line: rgba(217, 191, 140, .24); --plate-ink: #2A0E14;
}
[data-paleta="nuit"] {
  --bg: #0F1729; --ink: #ECE5D8; --muted: #A2A8B6; --metal: #CDAE73;
  --line: rgba(205, 174, 115, .24); --plate-ink: #0F1729;
}
[data-paleta="bouteille"] {
  --bg: #0F271F; --ink: #EEE7D8; --muted: #A3B2A7; --metal: #CFAA62;
  --line: rgba(207, 170, 98, .24); --plate-ink: #0F271F;
}
[data-paleta="porcelaine"] {
  --bg: #D6D2CA; --ink: #1F1A17; --muted: #5E5650; --metal: #6E1A26;
  --line: rgba(31, 26, 23, .18); --plate-ink: #6E1A26;
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 64px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Jost", system-ui, sans-serif; font-weight: 300; font-size: 16px; line-height: 1.6;
  transition: background-color .6s ease, color .6s ease;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 1px solid var(--metal); outline-offset: 4px; }
.serif { font-family: "Bodoni Moda", Didot, "Bodoni 72", Georgia, serif; }

/* Selector de idioma y moneda */
.switch { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; letter-spacing: .08em; }
.switch button { padding: 10px 6px; color: var(--muted); min-height: 40px; }
.switch button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--metal); text-underline-offset: 6px; }
.switch i { width: 1px; height: 12px; background: var(--line); margin: 0 4px; }

/* ---------- Portada ---------- */
.cover { min-height: 100svh; display: flex; flex-direction: column; align-items: center; padding: 0 16px 40px; position: relative; overflow: hidden; }
.cover-top { width: 100%; max-width: 1100px; display: flex; justify-content: space-between; align-items: center; padding-top: max(10px, env(safe-area-inset-top)); }
.place { font-size: 13px; letter-spacing: .12em; color: var(--muted); margin: 18px 0 0; text-align: center; }

.stage {
  position: relative; width: min(118vw, 74svh, 860px); aspect-ratio: 1; margin-top: -2svh;
  will-change: transform;
}
.stage img {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  -webkit-mask-image: radial-gradient(closest-side, #000 72%, transparent 100%);
          mask-image: radial-gradient(closest-side, #000 72%, transparent 100%);
}
/* El nombre vive impreso dentro del plato */
.monogram {
  position: absolute; left: 50%; top: 59.4%; width: 40%; transform: translate(-50%, -50%);
  margin: 0; text-align: center; color: var(--plate-ink);
  font-family: "Bodoni Moda", Didot, Georgia, serif; font-weight: 400; font-optical-sizing: auto;
  font-size: clamp(30px, calc(min(118vw, 74svh, 860px) * .082), 74px); line-height: 1; letter-spacing: -.01em;
  transition: color .6s ease;
}
.monogram small {
  display: block; font-family: "Jost", sans-serif; font-weight: 400; font-size: .17em; letter-spacing: .32em;
  margin-top: 1.1em; padding-left: .32em; color: var(--plate-ink); opacity: .7;
}
.lema { font-family: "Bodoni Moda", Georgia, serif; font-style: italic; font-size: clamp(20px, 5vw, 28px); margin: -1svh 0 0; text-align: center; text-wrap: balance; }
.to-menu {
  margin-top: 26px; font-size: 14px; letter-spacing: .12em; text-decoration: none; color: var(--muted);
  display: inline-flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px;
}
.to-menu span.ln { width: 1px; height: 44px; background: linear-gradient(var(--metal), transparent); }

/* ---------- Barra fija ---------- */
.bar {
  position: fixed; inset: 0 0 auto 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line); transform: translateY(-100%); transition: transform .45s cubic-bezier(.2,.7,.2,1), background-color .6s;
}
.bar.show { transform: none; }
.bar-in { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 18px; height: 56px; }
.bar .nm { font-family: "Bodoni Moda", Georgia, serif; font-size: 22px; flex: none; text-decoration: none; }
.bar nav { flex: 1; display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; justify-content: center; }
.bar nav::-webkit-scrollbar { display: none; }
.bar nav a { font-size: 14px; color: var(--muted); text-decoration: none; white-space: nowrap; padding: 6px 0; border-bottom: 1px solid transparent; }
.bar nav a.on { color: var(--ink); border-color: var(--metal); }
@media (max-width: 640px) { .bar nav { display: none; } .bar-in { justify-content: space-between; } }

/* ---------- Carta ---------- */
main { max-width: 600px; margin: 0 auto; padding: 0 20px; text-align: center; }
.note { padding: 72px 0 32px; }
.note p { font-family: "Bodoni Moda", Georgia, serif; font-style: italic; font-size: clamp(22px, 5.6vw, 30px); line-height: 1.35; margin: 0 auto; max-width: 24ch; text-wrap: balance; }
.note cite { display: block; font-style: normal; font-size: 14px; color: var(--muted); margin-top: 20px; letter-spacing: .04em; }

.course { padding: 64px 0 8px; }
.course h2 {
  font-family: "Bodoni Moda", Georgia, serif; font-weight: 400; font-style: italic;
  font-size: clamp(34px, 9vw, 48px); line-height: 1.05; margin: 0;
}
.course h2::after { content: ""; display: block; width: 28px; height: 1px; background: var(--metal); margin: 26px auto 8px; }
.dish { list-style: none; padding: 26px 0; }
.dishes { margin: 0; padding: 0; }
.dish h3 { font-family: "Bodoni Moda", Georgia, serif; font-weight: 500; font-size: 22px; line-height: 1.2; margin: 0; letter-spacing: -.005em; }
.dish p { margin: 6px auto 0; color: var(--muted); font-size: 15.5px; max-width: 34ch; }
.dish .pr { display: inline-block; margin-top: 10px; font-size: 15px; letter-spacing: .06em; font-variant-numeric: tabular-nums lining-nums; color: var(--metal); font-weight: 400; }
.mk { font-family: "Jost", sans-serif; font-weight: 400; font-size: 11px; letter-spacing: .08em; vertical-align: super; color: var(--muted); margin-left: 6px; }

/* Menú degustación: doble filete, como una carta impresa */
.tasting {
  margin: 72px 0 0; padding: 44px 28px; border: 1px solid var(--line);
  outline: 1px solid var(--line); outline-offset: -8px;
}
.tasting h2 { font-family: "Bodoni Moda", Georgia, serif; font-weight: 400; font-size: clamp(30px, 8vw, 40px); margin: 0 0 12px; line-height: 1.1; }
.tasting p { margin: 0 auto; color: var(--muted); max-width: 30ch; }
.tasting .big { font-family: "Bodoni Moda", Georgia, serif; font-size: 40px; color: var(--ink); margin: 22px 0 2px; font-variant-numeric: lining-nums; }
.tasting .per { font-size: 14px; color: var(--muted); }
.tasting .pair { margin-top: 18px; font-size: 15px; }
.tasting .pair b { font-weight: 400; color: var(--metal); margin-left: 6px; letter-spacing: .06em; }

/* ---------- Reservar ---------- */
.reserve { padding: 96px 0 40px; }
.reserve h2 { font-family: "Bodoni Moda", Georgia, serif; font-weight: 400; font-size: clamp(36px, 10vw, 56px); margin: 0 0 16px; line-height: 1; }
.reserve p { color: var(--muted); margin: 0 0 30px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 54px; padding: 0 34px;
  border: 1px solid var(--metal); color: var(--ink); text-decoration: none; font-size: 15px; letter-spacing: .1em;
  transition: background-color .3s, color .3s;
}
.btn:hover { background: var(--metal); color: var(--bg); }
.facts { margin: 48px 0 0; display: grid; gap: 22px; }
.facts dt { font-size: 13px; color: var(--muted); letter-spacing: .08em; }
.facts dd { margin: 2px 0 0; font-size: 16px; }
.facts a { text-decoration-color: var(--line); text-underline-offset: 4px; }

footer { max-width: 600px; margin: 0 auto; padding: 48px 20px 120px; text-align: center; color: var(--muted); font-size: 13.5px; border-top: 1px solid var(--line); }
footer p { margin: 0 0 6px; }

/* ---------- Panel de paletas (solo para la demo de venta) ---------- */
.demo-btn {
  position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 30;
  display: flex; align-items: center; gap: 12px; padding: 12px 18px 12px 14px;
  background: var(--ink); color: var(--bg); border-radius: 999px; font-size: 14px; letter-spacing: .04em;
  box-shadow: 0 10px 40px rgba(0,0,0,.35); transition: background-color .6s, color .6s;
}
.demo-btn .dots { display: flex; }
.demo-btn .dots i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ink); margin-left: -4px; }
.demo-btn .dots i:first-child { margin-left: 0; }
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .3s; }
.sheet {
  position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto;
  background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-bottom: 0;
  padding: 28px 22px calc(26px + env(safe-area-inset-bottom)); transform: translateY(105%);
  transition: transform .4s cubic-bezier(.2,.8,.2,1), background-color .6s; max-height: 90svh; overflow-y: auto; text-align: left;
}
.open .scrim { opacity: 1; pointer-events: auto; }
.open .sheet { transform: none; }
.sheet h2 { font-family: "Bodoni Moda", Georgia, serif; font-weight: 400; font-size: 28px; margin: 0 0 4px; }
.sheet .sub { color: var(--muted); font-size: 14.5px; margin: 0 0 22px; }
.sheet h3 { font-weight: 400; font-size: 13px; letter-spacing: .1em; color: var(--muted); margin: 26px 0 12px; }
.pals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.pal { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
.pal .sw { width: 54px; height: 54px; border-radius: 50%; position: relative; box-shadow: 0 0 0 1px var(--line); }
.pal .sw::after { content: ""; position: absolute; inset: 15px; border-radius: 50%; background: #EEEBE5; box-shadow: 0 0 0 2px var(--rim, #D6B26E); }
.pal[aria-pressed="true"] .sw { box-shadow: 0 0 0 1px var(--bg), 0 0 0 2.5px var(--ink); }
.metals { display: flex; gap: 12px; }
.metal { width: 36px; height: 36px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
.metal[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--ink); }
.qr { display: flex; gap: 18px; align-items: center; }
#qr { background: #fff; padding: 8px; width: 132px; height: 132px; flex: none; }
#qr img, #qr canvas { width: 116px !important; height: 116px !important; }
.qr p { margin: 0 0 12px; font-size: 14.5px; color: var(--muted); }
.qr .btn { min-height: 44px; padding: 0 18px; font-size: 13.5px; }
.x { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; font-size: 22px; color: var(--muted); }

/* ---------- Un solo momento de entrada ---------- */
@media (prefers-reduced-motion: no-preference) {
  .stage img { animation: plate 2.2s cubic-bezier(.2,.7,.2,1) both; }
  .monogram { animation: ink 1.6s ease .9s both; }
  .lema, .to-menu, .place { animation: fade 1.2s ease 1.5s both; }
  @keyframes plate { from { opacity: 0; transform: scale(1.08) rotate(-8deg); } to { opacity: 1; transform: none; } }
  @keyframes ink { from { opacity: 0; letter-spacing: .25em; filter: blur(6px); } to { opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
}
</style>
</head>
<body>

<div class="bar" id="bar" aria-hidden="true">
  <div class="bar-in">
    <a class="nm" href="#top" id="barName"></a>
    <nav id="barNav" aria-label="Secciones"></nav>
    <div class="switch">
      <button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button><i></i>
      <button type="button" data-cur="crc">₡</button><button type="button" data-cur="usd">$</button>
    </div>
  </div>
</div>

<header class="cover" id="top">
  <div class="cover-top">
    <div class="switch" role="group" aria-label="Idioma">
      <button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button>
    </div>
    <div class="switch" role="group" aria-label="Moneda">
      <button type="button" data-cur="crc">₡</button><button type="button" data-cur="usd">$</button>
    </div>
  </div>
  <p class="place" id="place"></p>
  <div class="stage" id="stage">
    <img id="plate" alt="" width="1600" height="1600" decoding="async" fetchpriority="high">
    <h1 class="monogram" id="mono"></h1>
  </div>
  <p class="lema" id="lema"></p>
  <a class="to-menu" href="#carta"><span id="toMenu"></span><span class="ln"></span></a>
</header>

<main id="carta">
  <section class="note"><p id="noteTxt"></p><cite id="noteSig"></cite></section>
  <div id="courses"></div>
  <section class="tasting" id="tasting"></section>
  <section class="reserve" id="reservar">
    <h2 id="resTitle"></h2>
    <p id="resSub"></p>
    <a class="btn" id="wa" target="_blank" rel="noopener"></a>
    <dl class="facts">
      <div><dt id="hLbl"></dt><dd id="hours"></dd></div>
      <div><dt id="aLbl"></dt><dd><a id="addr" target="_blank" rel="noopener"></a></dd></div>
      <div><dt>Instagram</dt><dd><a id="ig" target="_blank" rel="noopener"></a></dd></div>
    </dl>
  </section>
</main>

<footer>
  <p id="legend"></p>
  <p id="taxes"></p>
</footer>

<div id="demo" hidden>
  <button class="demo-btn" id="demoOpen" type="button" aria-haspopup="dialog">
    <span class="dots"><i style="background:#2A0E14"></i><i style="background:#0F1729"></i><i style="background:#0F271F"></i><i style="background:#D6D2CA"></i></span>
    Cambiar paleta
  </button>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
    <button class="x" id="demoClose" type="button" aria-label="Cerrar">×</button>
    <h2 id="sheetT">La identidad de tu casa</h2>
    <p class="sub">Tocá una paleta y la carta entera cambia. Tus platos y precios se quedan igual.</p>
    <div class="pals" id="pals"></div>
    <h3>Filo de la vajilla</h3>
    <div class="metals" id="metals"></div>
    <h3>QR para las mesas</h3>
    <div class="qr">
      <div id="qr"></div>
      <div><p>Se imprime en la mesa o en la cuenta. El turista ve la carta en su idioma.</p>
      <button class="btn" id="qrDl" type="button">Descargar QR</button></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  const R = window.RESTAURANTE;
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const q = new URLSearchParams(location.search);

  const PALETAS = {
    bordeaux:   { nombre: "Bordeaux",   bg: "#2A0E14", rim: "#D9BF8C" },
    nuit:       { nombre: "Nuit",       bg: "#0F1729", rim: "#CDAE73" },
    bouteille:  { nombre: "Bouteille",  bg: "#0F271F", rim: "#CFAA62" },
    porcelaine: { nombre: "Porcelaine", bg: "#D6D2CA", rim: "#6E1A26" }
  };
  const METALES = [
    { n: "Oro", c: null }, { n: "Plata", c: "#C9CCD1" }, { n: "Cobre", c: "#C48A63" }, { n: "Champán", c: "#E6D3AE" }
  ];

  const T = {
    es: { toMenu: "Ver la carta", resT: "Reservar mesa", resS: "Respondemos por WhatsApp en minutos.", wa: "Reservar por WhatsApp",
          waMsg: "Hola, quisiera reservar una mesa en ", h: "Horario", a: "Dirección", per: "por persona",
          leg: "v vegetariano   vg vegano   sg sin gluten", taxes: "Precios en colones con impuestos y servicio incluidos.",
          taxesUsd: "Precios en dólares, aproximados al tipo de cambio del día. Impuestos y servicio incluidos.",
          mk: { v: "v", vg: "vg", sg: "sg" } },
    en: { toMenu: "See the menu", resT: "Book a table", resS: "We reply on WhatsApp within minutes.", wa: "Book on WhatsApp",
          waMsg: "Hello, I'd like to book a table at ", h: "Hours", a: "Address", per: "per person",
          leg: "v vegetarian   vg vegan   gf gluten-free", taxes: "Prices in colones, taxes and service included.",
          taxesUsd: "Prices in US dollars at today's exchange rate. Taxes and service included.",
          mk: { v: "v", vg: "vg", sg: "gf" } }
  };

  let lang = store.get("carta-lang") || ((navigator.language || "es").slice(0, 2) === "es" ? "es" : "en");
  let cur = store.get("carta-cur") || (lang === "en" ? "usd" : "crc");
  let paleta = q.get("paleta") || R.paleta || "bordeaux";
  if (!PALETAS[paleta]) paleta = "bordeaux";
  let metal = R.metal || null;

  const t = (o) => (o && (o[lang] || o.es)) || "";
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const price = (crc) => {
    if (cur === "usd") return "$" + Math.round(crc / R.tipoCambio);
    return String(crc).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  };

  function applyPaleta() {
    const html = document.documentElement;
    html.setAttribute("data-paleta", paleta);
    if (metal) html.style.setProperty("--metal", metal); else html.style.removeProperty("--metal");
    const img = $("#plate");
    const src = "img/" + paleta + ".jpg";
    if (!img.getAttribute("src")) img.src = src;
    else if (!img.src.endsWith(src)) {
      img.style.transition = "opacity .35s"; img.style.opacity = 0;
      const n = new Image(); n.onload = () => { img.src = src; img.style.opacity = 1; }; n.src = src;
    }
    const meta = document.querySelector('meta[name="theme-color"]') || document.head.appendChild(Object.assign(document.createElement("meta"), { name: "theme-color" }));
    meta.content = PALETAS[paleta].bg;
    $$(".pal").forEach((b) => b.setAttribute("aria-pressed", b.dataset.p === paleta));
    $$(".metal").forEach((b) => b.setAttribute("aria-pressed", (b.dataset.m || null) === metal));
  }

  function render() {
    document.documentElement.lang = lang;
    document.title = R.nombre + (lang === "es" ? ", carta" : ", menu");
    $("#mono").innerHTML = esc(R.nombre);
    $("#barName").textContent = R.nombre;
    $("#place").textContent = t(R.lugar);
    $("#lema").textContent = t(R.lema);
    $("#toMenu").textContent = T[lang].toMenu;
    $("#noteTxt").textContent = t(R.nota.texto);
    $("#noteSig").textContent = t(R.nota.firma);

    $("#barNav").innerHTML = R.categorias.map((c) => '<a href="#' + c.id + '" data-id="' + c.id + '">' + esc(t(c.nombre)) + "</a>").join("") +
      '<a href="#reservar" data-id="reservar">' + T[lang].resT + "</a>";

    const mk = (arr) => (arr || []).map((k) => T[lang].mk[k]).join(" ");
    $("#courses").innerHTML = R.categorias.map((c) =>
      '<section class="course" id="' + c.id + '"><h2>' + esc(t(c.nombre)) + '</h2><ul class="dishes">' +
      c.platos.map((p) => '<li class="dish"><h3>' + esc(t(p.nombre)) +
        (p.marcas && p.marcas.length ? '<span class="mk">' + mk(p.marcas) + "</span>" : "") + "</h3>" +
        (p.desc ? "<p>" + esc(t(p.desc)) + "</p>" : "") + '<span class="pr">' + price(p.precio) + "</span></li>").join("") +
      "</ul></section>").join("");

    const d = R.degustacion;
    $("#tasting").hidden = !d;
    if (d) $("#tasting").innerHTML = "<h2>" + esc(t(d.nombre)) + "</h2><p>" + esc(t(d.desc)) + '</p><div class="big">' + price(d.precio) +
      '</div><div class="per">' + T[lang].per + '</div><div class="pair">' + esc(t(d.maridaje)) + "<b>" + price(d.precioMaridaje) + "</b></div>";

    $("#resTitle").textContent = T[lang].resT;
    $("#resSub").textContent = T[lang].resS;
    $("#wa").textContent = T[lang].wa;
    $("#wa").href = "https://wa.me/" + R.whatsapp + "?text=" + encodeURIComponent(T[lang].waMsg + R.nombre + ".");
    $("#hLbl").textContent = T[lang].h; $("#hours").textContent = t(R.horario);
    $("#aLbl").textContent = T[lang].a; $("#addr").textContent = t(R.direccion); $("#addr").href = R.mapa;
    $("#ig").textContent = "@" + R.instagram; $("#ig").href = "https://instagram.com/" + R.instagram;
    $("#legend").textContent = T[lang].leg;
    $("#taxes").textContent = cur === "usd" ? T[lang].taxesUsd : T[lang].taxes;

    $$("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    $$("[data-cur]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.cur === cur));
    observe();
  }

  // Barra fija + sección activa
  let io;
  function observe() {
    if (io) io.disconnect();
    io = new IntersectionObserver((es) => es.forEach((e) => {
      if (e.isIntersecting) $$("#barNav a").forEach((a) => a.classList.toggle("on", a.dataset.id === e.target.id));
    }), { rootMargin: "-40% 0px -55% 0px" });
    $$(".course, #reservar").forEach((s) => io.observe(s));
  }

  // Scroll: el plato se aleja suavemente mientras bajás
  const stage = $("#stage"), bar = $("#bar");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let ticking = false;
  function onScroll() {
    const y = scrollY, h = innerHeight;
    bar.classList.toggle("show", y > h * 0.75);
    bar.setAttribute("aria-hidden", y > h * 0.75 ? "false" : "true");
    if (!still && y < h * 1.2) {
      const k = Math.min(y / h, 1);
      stage.style.transform = "translateY(" + (k * h * 0.18) + "px) scale(" + (1 - k * 0.12) + ") rotate(" + (k * 14) + "deg)";
      stage.style.opacity = 1 - k * 0.85;
    }
    ticking = false;
  }
  addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });

  document.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.lang) { lang = b.dataset.lang; store.set("carta-lang", lang); render(); }
    if (b.dataset.cur) { cur = b.dataset.cur; store.set("carta-cur", cur); render(); }
    if (b.dataset.p) { paleta = b.dataset.p; applyPaleta(); }
    if (b.classList.contains("metal")) { metal = b.dataset.m || null; applyPaleta(); }
  });

  // Panel de demo
  if (q.get("cliente") !== "1" && R.modoDemo !== false) {
    $("#demo").hidden = false;
    $("#pals").innerHTML = Object.entries(PALETAS).map(([k, v]) =>
      '<button class="pal" type="button" data-p="' + k + '"><span class="sw" style="background:' + v.bg + ";--rim:" + v.rim + '"></span>' + v.nombre + "</button>").join("");
    $("#metals").innerHTML = METALES.map((m) =>
      '<button class="metal" type="button" data-m="' + (m.c || "") + '" aria-label="' + m.n + '" title="' + m.n + '" style="background:' +
      (m.c || "linear-gradient(135deg,#E9CF95,#B98F45)") + '"></button>').join("");
    const open = () => { document.body.classList.add("open"); $("#demoClose").focus(); };
    const close = () => { document.body.classList.remove("open"); $("#demoOpen").focus(); };
    $("#demoOpen").onclick = open; $("#demoClose").onclick = close; $("#scrim").onclick = close;
    addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
    const url = location.href.split("?")[0] + "?cliente=1";
    if (window.QRCode) new QRCode($("#qr"), { text: url, width: 232, height: 232, colorDark: "#111111", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
    $("#qrDl").onclick = () => {
      const c = $("#qr canvas"); if (!c) return;
      const a = document.createElement("a"); a.download = "qr-" + R.nombre.toLowerCase().replace(/\s+/g, "-") + ".png";
      a.href = c.toDataURL("image/png"); a.click();
    };
  }

  render(); applyPaleta(); onScroll();
})();
</script>
</body>
</html>
