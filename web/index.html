<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holdfast</title>
<meta name="description" content="Back early-stage projects with USDC. Your money stays locked in a contract no one owns, and teams are paid in stages only when backers vote yes.">
<meta name="theme-color" content="#0f1012">
<link rel="icon" href="./assets/holdfast-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

    <a class="brand" href="#/" aria-label="Holdfast home">
      <img src="./assets/holdfast-mark.svg" width="26" height="26" alt="">
      Holdfast
    </a>
    <nav class="links" aria-label="Main">
      <a href="#/" data-nav="home">Projects</a>
      <a href="#/launch" data-nav="launch">Launch</a>
      <a href="#/portfolio" data-nav="portfolio">Portfolio</a>
      <a href="#/owner" data-nav="owner" class="d-none" id="nav-owner">Owner</a>
    </nav>
    <div class="nav-r">
      <span class="net" id="net"><i></i><span></span></span>
      <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button></div>
      <a class="creator-link" href="#/launch">For creators</a>
      <button class="btn btn-dark btn-sm" id="connect">Connect wallet</button>
    </div>
  </div>
</header>
<nav class="tabs" aria-label="Main">
  <a href="#/" data-nav="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Projects</a>
  <a href="#/launch" data-nav="launch"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Launch</a>
  <a href="#/portfolio" data-nav="portfolio"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="6.5" width="17" height="13" rx="3"/><path d="M8.5 6.5V5a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v1.5"/></svg>Portfolio</a>

</nav>
<main id="app"></main>
<footer class="foot">

  <a href="https://github.com/strvenjosue02-a11y/Vyron-pay-9" target="_blank" rel="noopener">Open source</a>
</footer>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-live="polite"></div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="./app.js"></script>
