<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07262B">
<title>Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Manrope:wght@300..800&display=swap" rel="stylesheet">
<style>
/* ================= Paletas ================= */
:root, [data-paleta="oceano"] {
  --bg: #07262B; --raise: #0C3238; --ink: #E6F2EF; --muted: #9DB9B6; --acc: #5FD6C7; --on-acc: #05211F;
  --line: rgba(95, 214, 199, .28); --plate-ink: #07262B; --ok: #8BE0A4; --busy: rgba(230, 242, 239, .12);
}
[data-paleta="arena"] {
  --bg: #E9E5E0; --raise: #F3F0EB; --ink: #14272B; --muted: #4C5C5E; --acc: #0A5C63; --on-acc: #FFFFFF;
  --line: rgba(20, 39, 43, .2); --plate-ink: #0A4A50; --ok: #1F6B3A; --busy: rgba(20, 39, 43, .1);
}
[data-paleta="atardecer"] {
  --bg: #261A2E; --raise: #30223A; --ink: #F6EBE4; --muted: #C7B3C0; --acc: #FF9F7F; --on-acc: #2A1426;
  --line: rgba(255, 159, 127, .3); --plate-ink: #261A2E; --ok: #B5E0A0; --busy: rgba(246, 235, 228, .12);
}
[data-paleta="selva"] {
  --bg: #102A1F; --raise: #163527; --ink: #EBF0E2; --muted: #AABBA9; --acc: #C5D58F; --on-acc: #10261B;
  --line: rgba(197, 213, 143, .28); --plate-ink: #102A1F; --ok: #9FE0A8; --busy: rgba(235, 240, 226, .12);
}

/* ================= Base ================= */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 72px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Manrope", system-ui, sans-serif; font-size: 16.5px; line-height: 1.6; font-weight: 400;
  transition: background-color .8s ease, color .8s ease; -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; }
h1, h2, h3, h4 { font-family: "Fraunces", Georgia, serif; font-optical-sizing: auto; font-variation-settings: "SOFT" 100, "WONK" 0; font-weight: 400; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 20px; }
.center { text-align: center; }

.switch { display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; }
.switch button { padding: 10px 7px; color: var(--muted); min-height: 44px; min-width: 32px; }
.switch button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--acc); text-decoration-thickness: 1.5px; text-underline-offset: 7px; }
.switch i { width: 1px; height: 14px; background: var(--line); margin: 0 6px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 0 30px;
  border: 1px solid var(--acc); color: var(--ink); text-decoration: none; font-size: 15.5px; font-weight: 600;
  transition: background-color .25s, color .25s; border-radius: 999px;
}
.btn:hover { background: color-mix(in srgb, var(--acc) 14%, transparent); }
.btn.solid { background: var(--acc); color: var(--on-acc); }
.btn.solid:hover { background: color-mix(in srgb, var(--acc) 88%, var(--ink)); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.link { color: var(--acc); font-weight: 600; text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; padding: 6px 0; display: inline-block; }

.heading { font-size: clamp(34px, 9vw, 50px); line-height: 1.05; margin: 0; letter-spacing: -.02em; }
.heading::after { content: ""; display: block; width: 36px; height: 2px; background: var(--acc); margin: 22px auto 0; border-radius: 2px; }
.lead { color: var(--muted); margin: 18px auto 0; max-width: 42ch; }

/* Números que ruedan */
.roll { display: inline-flex; align-items: flex-start; height: 1.25em; line-height: 1.25em; overflow: hidden; vertical-align: bottom; font-variant-numeric: tabular-nums lining-nums; }
.roll .c { display: inline-block; height: 1.25em; overflow: hidden; }
.roll .s { display: flex; flex-direction: column; transition: transform .75s cubic-bezier(.2,.8,.2,1); }
.roll .s span, .roll .t { display: block; height: 1.25em; }
.roll .sp { width: .22em; }
.roll .cm { margin-left: -.16em; }

/* ================= Portada ================= */
.cover { min-height: 100svh; display: flex; flex-direction: column; align-items: center; padding: 0 16px 36px; overflow: hidden;
  --tag-x: 61.96%; --tag-y: 52.6%; --tag-rot: 8deg; --tag-w: 45.65%; }
.cover-top { width: 100%; max-width: 1100px; display: flex; justify-content: space-between; align-items: center; padding-top: env(safe-area-inset-top); gap: 8px; }
.chip-top { font-size: 14px; font-weight: 600; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; min-height: 36px; display: inline-flex; align-items: center; }
.place { font-size: 14px; color: var(--muted); margin: 8px 0 0; text-align: center; letter-spacing: .02em; font-weight: 500; }
.stage { --s: min(116vw, 64svh, 800px); position: relative; width: var(--s); aspect-ratio: 1; margin-top: -1svh; will-change: transform; }
.stage img {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  -webkit-mask-image: radial-gradient(closest-side, #000 72%, transparent 100%);
          mask-image: radial-gradient(closest-side, #000 72%, transparent 100%);
}
.monogram {
  position: absolute; left: var(--tag-x); top: var(--tag-y); width: calc(var(--tag-w) * .8); transform: translate(-50%, -50%) rotate(var(--tag-rot));
  margin: 0; text-align: center; font-weight: 500; line-height: 1.02; letter-spacing: -.02em; text-wrap: balance;
  font-size: calc(var(--s) * .078);
  color: transparent; -webkit-background-clip: text; background-clip: text;
  background-image: linear-gradient(105deg, var(--plate-ink) 0 40%, #B88A3C 46%, #FFF0C4 50%, #B88A3C 54%, var(--plate-ink) 60% 100%);
  background-size: 300% 100%; background-position: 0 0;
}
.lema { font-family: "Fraunces", Georgia, serif; font-variation-settings: "SOFT" 100; font-size: clamp(22px, 5.6vw, 30px); line-height: 1.2; margin: -1svh 0 0; text-align: center; text-wrap: balance; max-width: 24ch; }
.status { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 16px; margin: 14px 0 0; font-size: 14.5px; color: var(--muted); font-weight: 500; }
.status span { display: inline-flex; align-items: center; gap: 9px; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.status .free i { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }
.cover-cta { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; justify-content: center; }

/* ================= Barra fija ================= */
.bar {
  position: fixed; inset: 0 0 auto 0; z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line);
  transform: translateY(-100%); transition: transform .45s cubic-bezier(.2,.7,.2,1), background-color .8s; visibility: hidden;
}
.bar.show { transform: none; visibility: visible; }
.bar-in { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 18px; height: 60px; }
.bar .nm { font-family: "Fraunces", Georgia, serif; font-variation-settings: "SOFT" 100; font-size: 23px; font-weight: 500; text-decoration: none; flex: none; }
.bar nav { flex: 1; display: flex; gap: 22px; justify-content: center; }
.bar nav a { font-size: 15px; font-weight: 500; color: var(--muted); text-decoration: none; padding: 8px 0; border-bottom: 2px solid transparent; white-space: nowrap; }
.bar nav a.on { color: var(--ink); border-color: var(--acc); }
@media (max-width: 860px) { .bar nav { display: none; } .bar-in { justify-content: space-between; } }

/* ================= Resumen y anfitrión ================= */
.sum { padding: 84px 0 8px; text-align: center; }
.sum p { font-family: "Fraunces", Georgia, serif; font-variation-settings: "SOFT" 100; font-size: clamp(24px, 6vw, 33px); line-height: 1.28; margin: 0 auto; max-width: 26ch; text-wrap: balance; }
.host { margin: 44px auto 0; max-width: 40ch; text-align: center; color: var(--muted); }
.host cite { display: block; font-style: normal; color: var(--ink); font-weight: 600; margin-top: 10px; font-size: 15px; }

/* ================= El cielo de hoy ================= */
.sky { margin: 76px 0 0; text-align: center; }
.arc { position: relative; width: 100%; max-width: 420px; margin: 0 auto; aspect-ratio: 2 / 1.05; }
.arc svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.arc .orb { position: absolute; width: 17%; aspect-ratio: 1; transform: translate(-50%, -50%); transition: left 1s, top 1s; }
.arc .orb img { width: 100%; height: 100%; display: block; }
.arc .moon { border-radius: 50%; overflow: hidden; filter: drop-shadow(0 0 14px rgba(240, 232, 214, .25)); }
.arc .ends { position: absolute; left: 0; right: 0; bottom: -30px; display: flex; justify-content: space-between; font-size: 13.5px; color: var(--muted); font-weight: 500; }
.sky h3 { font-size: clamp(26px, 7vw, 34px); line-height: 1.15; margin: 48px 0 6px; text-wrap: balance; }
.sky .when { color: var(--muted); margin: 0; }
.wx { display: flex; justify-content: center; margin: 22px auto 0; max-width: 420px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.wx div { flex: 1; padding: 14px 6px; }
.wx div + div { border-left: 1px solid var(--line); }
.wx b { display: block; font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 24px; line-height: 1.1; }
.wx small { font-size: 13px; color: var(--muted); font-weight: 500; }
.sky .btn { margin-top: 24px; }

/* ================= La casa ================= */
#casa { padding-top: 96px; }
.render { position: relative; margin: 36px -20px 0; aspect-ratio: 8 / 5; overflow: hidden; background: #111; }
.render img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ref { position: absolute; z-index: 2; left: 12px; top: 12px; font-size: 12.5px; font-weight: 600; color: #F3EAE1; background: rgba(0,0,0,.5); padding: 3px 10px; border-radius: 999px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
@media (min-width: 680px) { .render { margin: 36px 0 0; border-radius: 20px; } }
.desc { color: var(--muted); max-width: 44ch; margin: 26px auto 0; }
.gallery { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 26px -20px 0; padding: 0 20px 6px; scrollbar-width: none; }
.gallery::-webkit-scrollbar { display: none; }
.shot { position: relative; flex: 0 0 72%; aspect-ratio: 4 / 5; overflow: hidden; border-radius: 18px; scroll-snap-align: center; background: #111; }
.shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
@media (min-width: 680px) { .gallery { margin: 26px 0 0; padding: 0; } .shot { flex-basis: 31%; } }

/* ================= Habitaciones y comodidades ================= */
.rooms, .amen { padding-top: 96px; text-align: center; }
.room-list { list-style: none; margin: 30px 0 0; padding: 0; text-align: left; }
.room { padding: 22px 0; border-top: 1px solid var(--line); }
.room:last-child { border-bottom: 1px solid var(--line); }
.room h3 { font-size: 23px; font-weight: 500; margin: 0 0 2px; line-height: 1.2; }
.room p { margin: 0; color: var(--muted); max-width: 46ch; }
.amen-list { list-style: none; margin: 30px 0 0; padding: 0; display: grid; gap: 4px 24px; text-align: left; }
@media (min-width: 560px) { .amen-list { grid-template-columns: 1fr 1fr; } }
.amen-list li { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); }
.amen-list svg { width: 18px; height: 18px; flex: none; margin-top: 4px; fill: none; stroke: var(--acc); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ================= Reservar: calendario y cotizador ================= */
.reserve { padding-top: 104px; text-align: center; }
.avail-note { color: var(--acc); font-weight: 600; margin: 12px 0 0; }
.cal { margin: 34px 0 0; text-align: left; }
.cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.cal-head button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); color: var(--ink); font-size: 18px; }
.cal-head button[disabled] { opacity: .3; pointer-events: none; }
.cal-head .hint { font-size: 14px; color: var(--muted); font-weight: 500; text-align: center; flex: 1; padding: 0 8px; }
.months { display: grid; gap: 26px; }
@media (min-width: 760px) { .months { grid-template-columns: 1fr 1fr; } .reserve .wrap-cal { max-width: 860px; margin-left: auto; margin-right: auto; } }
.month h4 { font-size: 21px; margin: 0 0 8px; text-align: center; font-weight: 500; }
.month h4::first-letter { text-transform: uppercase; }
.dow, .days { display: grid; grid-template-columns: repeat(7, 1fr); }
.dow span { text-align: center; font-size: 12.5px; color: var(--muted); font-weight: 600; padding: 6px 0; }
.day { aspect-ratio: 1; min-height: 44px; margin: 1px 0; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; border-radius: 50%; position: relative; z-index: 0; }
.day.empty { visibility: hidden; pointer-events: none; }
.day:disabled { color: var(--muted); opacity: .55; cursor: not-allowed; }
.day.busy:disabled { opacity: .5; text-decoration: line-through; background: var(--busy); }
.day.today { box-shadow: inset 0 0 0 1px var(--line); }
.day.inr { background: color-mix(in srgb, var(--acc) 22%, transparent); border-radius: 0; }
.day.s, .day.e { background: var(--acc); color: var(--on-acc); border-radius: 50%; }
.day.inr.rs { border-radius: 999px 0 0 999px; } .day.inr.re { border-radius: 0 999px 999px 0; }
.legend { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 12px; font-weight: 500; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }

form.book { margin: 30px 0 0; text-align: left; display: grid; gap: 18px; }
.picked { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.picked div { padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--raise); transition: background-color .8s; }
.picked small { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
.picked b { font-family: "Fraunces", Georgia, serif; font-variation-settings: "SOFT" 100; font-weight: 400; font-size: 19px; }
.picked b::first-letter { text-transform: uppercase; }
.hint2 { font-size: 14px; min-height: 20px; margin: 0; color: var(--muted); font-weight: 500; }
.hint2.bad { color: var(--acc); }
.field label, .field .lbl { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
.field input, .field textarea {
  width: 100%; min-height: 52px; padding: 12px 14px; background: var(--raise); border: 1px solid var(--line); border-radius: 14px;
  font-size: 16px; transition: border-color .2s, background-color .8s;
}
.field input:focus, .field textarea:focus { border-color: var(--acc); outline: none; }
.field textarea { min-height: 84px; resize: vertical; }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); background: var(--raise); min-height: 52px; border-radius: 14px; }
.stepper button { width: 52px; height: 52px; font-size: 22px; color: var(--acc); flex: none; }
.stepper output { flex: 1; text-align: center; font-size: 17px; font-weight: 600; }
.extras { display: grid; gap: 10px; }
.check { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; cursor: pointer; font-size: 15.5px; }
.check .l { display: flex; gap: 12px; align-items: center; }
.check input { width: 22px; height: 22px; accent-color: var(--acc); flex: none; }
.check .pr { color: var(--acc); font-weight: 700; white-space: nowrap; }

.quote { border: 1px solid var(--line); border-radius: 18px; padding: 18px; background: var(--raise); transition: background-color .8s; }
.quote .empty { color: var(--muted); margin: 0; font-weight: 500; }
.q-row { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.q-row span:first-child { color: var(--muted); }
.q-row.disc span:last-child { color: var(--ok); font-weight: 700; }
.q-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; }
.q-total span { color: var(--muted); font-weight: 600; }
.q-total b { font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 36px; line-height: 1.1; }
.q-save { margin: 8px 0 0; color: var(--ok); font-weight: 700; font-size: 14.5px; text-align: right; }
form.book .btn { width: 100%; }
.fine { font-size: 13.5px; color: var(--muted); text-align: center; margin: 2px 0 0; }

/* ================= Guía del huésped ================= */
.guide { padding-top: 104px; display: grid; gap: 30px; }
.guide h2 { text-align: center; }
.g-card { padding: 18px 20px; border: 1px solid var(--line); border-radius: 18px; background: var(--raise); transition: background-color .8s; }
.g-card h3 { font-size: 21px; font-weight: 500; margin: 0 0 8px; }
.g-times { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.g-times b { display: block; font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 24px; }
.g-times small { color: var(--muted); font-weight: 600; font-size: 13px; }
.g-list { list-style: none; margin: 0; padding: 0; }
.g-list li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.g-list li:last-child { border-bottom: 0; }
.g-list li span:last-child { color: var(--muted); text-align: right; }
.wifi { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.wifi small { display: block; color: var(--muted); font-size: 13.5px; }
.wifi .btn { min-height: 44px; padding: 0 18px; font-size: 14.5px; flex: none; }

/* ================= Reseñas ================= */
.reviews { padding-top: 104px; text-align: center; }
.score { font-family: "Fraunces", Georgia, serif; font-size: 64px; line-height: 1; margin: 28px 0 8px; }
.stars { display: inline-flex; gap: 4px; color: var(--acc); }
.stars svg { width: 18px; height: 18px; fill: currentColor; }
.count { color: var(--muted); font-size: 14.5px; margin: 8px 0 0; font-weight: 500; }
.quotes { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 32px -20px 0; padding: 0 20px 8px; scrollbar-width: none; }
.quotes::-webkit-scrollbar { display: none; }
.rq { flex: 0 0 86%; scroll-snap-align: center; margin: 0; padding: 26px 24px; background: var(--raise); border: 1px solid var(--line); border-radius: 18px; text-align: left; transition: background-color .8s; }
.rq p { font-family: "Fraunces", Georgia, serif; font-variation-settings: "SOFT" 100; font-size: 20px; line-height: 1.4; margin: 0; }
.rq cite { display: block; font-style: normal; color: var(--muted); font-size: 14.5px; margin-top: 16px; font-weight: 500; }
@media (min-width: 760px) { .quotes { flex-direction: column; overflow: visible; margin: 32px 0 0; padding: 0; } .rq { flex: none; } }
.reviews .link { margin-top: 22px; }

/* ================= Información ================= */
.info { padding-top: 96px; display: grid; gap: 30px; }
.info h3 { font-size: 22px; font-weight: 500; margin: 0 0 8px; }
.info p { margin: 0; color: var(--muted); }
footer { margin-top: 80px; border-top: 1px solid var(--line); padding: 32px 20px 128px; text-align: center; color: var(--muted); font-size: 14px; }
footer p { margin: 0 auto 6px; max-width: 54ch; }
footer button { color: var(--acc); text-decoration: underline; text-underline-offset: 4px; font-weight: 600; padding: 8px; margin-bottom: 10px; font-size: 15.5px; }

/* ================= Botones flotantes ================= */
.dock { position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 25; transform: translateY(160%); transition: transform .4s cubic-bezier(.2,.7,.2,1); }
.dock.show { transform: none; }
.dock .btn { box-shadow: 0 12px 36px rgba(0,0,0,.35); min-height: 52px; }
.demo-btn {
  position: fixed; left: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 30; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 12px; min-height: 52px;
  background: var(--ink); color: var(--bg); border-radius: 999px; font-size: 14.5px; font-weight: 700; box-shadow: 0 12px 36px rgba(0,0,0,.35);
  transform: translateY(160%); transition: transform .4s cubic-bezier(.2,.7,.2,1), background-color .8s, color .8s;
}
.demo-btn.show { transform: none; }
.dots { display: flex; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ink); margin-left: -4px; }
.dots i:first-child { margin-left: 0; }

/* ================= Paneles ================= */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .3s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; max-width: 540px; margin: 0 auto; background: var(--bg); color: var(--ink);
  border: 1px solid var(--line); border-bottom: 0; border-radius: 24px 24px 0 0; padding: 28px 22px calc(26px + env(safe-area-inset-bottom));
  transform: translateY(105%); transition: transform .4s cubic-bezier(.2,.8,.2,1), background-color .8s, visibility 0s .4s; max-height: 90svh; overflow-y: auto; visibility: hidden;
}
.sheet.on { transform: none; visibility: visible; transition: transform .4s cubic-bezier(.2,.8,.2,1), background-color .8s; }
.sheet h2 { font-size: 30px; margin: 0 0 4px; padding-right: 40px; line-height: 1.15; }
.sheet .sub { color: var(--muted); font-size: 15px; margin: 0 0 22px; }
.sheet h3 { font-family: "Manrope", sans-serif; font-weight: 700; font-size: 14px; color: var(--muted); margin: 26px 0 12px; font-variation-settings: normal; }
.x { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; font-size: 24px; color: var(--muted); border-radius: 50%; }
.pals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pal { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; text-align: center; font-weight: 600; }
.pal .sw { width: 56px; height: 56px; border-radius: 50%; position: relative; box-shadow: 0 0 0 1px var(--line); }
.pal .sw::after { content: ""; position: absolute; inset: 17px 13px; border-radius: 6px; background: #EEEBE5; box-shadow: 0 0 0 2px var(--rim); }
.pal .sw.auto { background: conic-gradient(#E9E5E0 0 33%, #261A2E 0 66%, #07262B 0); }
.pal[aria-pressed="true"] .sw { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--ink); }
.qrs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.qr { text-align: center; font-size: 14px; color: var(--muted); }
.qr .code { background: #fff; padding: 8px; width: 100%; max-width: 150px; aspect-ratio: 1; margin: 0 auto 8px; }
.qr .code img, .qr .code canvas { width: 100% !important; height: auto !important; display: block; }
.qr button { color: var(--acc); font-weight: 700; text-decoration: underline; text-underline-offset: 4px; padding: 6px; }
.rate { padding: 14px 0; border-bottom: 1px solid var(--line); }
.rate .lbl { font-family: "Fraunces", Georgia, serif; font-size: 20px; margin-bottom: 8px; }
.rate .st { display: flex; gap: 6px; }
.rate .st button { width: 46px; height: 46px; color: var(--line); transition: color .15s, transform .15s; }
.rate .st button svg { width: 34px; height: 34px; fill: currentColor; }
.rate .st button.on { color: var(--acc); }
.rate .st button:active { transform: scale(.9); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 16px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 0 16px; min-height: 40px; font-size: 14.5px; color: var(--muted); font-weight: 600; }
.chip[aria-pressed="true"] { border-color: var(--acc); color: var(--ink); background: color-mix(in srgb, var(--acc) 14%, transparent); }
.step[hidden] { display: none; }
.step .btn { width: 100%; margin-top: 18px; }
.thanks { text-align: center; padding: 20px 0 0; }
.thanks h2 { padding: 0; }
.toast { position: fixed; left: 50%; bottom: 90px; z-index: 60; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14.5px; font-weight: 700; transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ================= Un solo momento de entrada ================= */
@media (prefers-reduced-motion: no-preference) {
  .stage img { animation: drop 2s cubic-bezier(.2,.7,.2,1) both; }
  .monogram { animation: ink 1.3s ease .9s both, shine 2.4s cubic-bezier(.4,0,.2,1) 2.2s both; }
  .lema, .status, .cover-cta, .place { animation: fade 1.1s ease 1.4s both; }
  @keyframes drop { from { opacity: 0; transform: translateY(-5%) rotate(-5deg) scale(1.05); } to { opacity: 1; transform: none; } }
  @keyframes ink { from { opacity: 0; filter: blur(6px); } to { opacity: 1; filter: none; } }
  @keyframes shine { from { background-position: 100% 0; } to { background-position: 0 0; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
}
</style>

    <a class="nm" href="#top" id="barName"></a>
    <nav id="barNav" aria-label="Secciones"></nav>

      <button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button><i></i>
      <button type="button" data-cur="usd" aria-label="Dólares">$</button><button type="button" data-cur="crc" aria-label="Colones">₡</button>
    </div>
  </div>
</div>

<header class="cover" id="top">

    </div>
    <button type="button" class="chip-top" id="topChip" hidden></button>
    <div class="switch" role="group" aria-label="Moneda / Currency">
      <button type="button" data-cur="usd" aria-label="Dólares">$</button><button type="button" data-cur="crc" aria-label="Colones">₡</button>

  </div>
  <p class="place" id="place"></p>
  <div class="stage" id="stage">

    <h1 class="monogram" id="mono"></h1>
  </div>
  <p class="lema" id="lema"></p>
  <div class="status" id="status"><span id="availState"><i></i><em style="font-style:normal"></em></span></div>
  <div class="cover-cta">
    <a class="btn solid" href="#reservar" data-t="datesBtn"></a>
    <a class="btn" href="#casa" data-t="houseBtn"></a>
  </div>
</header>

<main class="wrap">
  <section class="sum"><p id="sumTxt"></p>
    <div class="host"><span id="hostTxt"></span><cite id="hostName"></cite></div>
  </section>

  <section class="sky" id="cielo">
    <div class="arc" id="arc">

        <path d="M6 100 A94 94 0 0 1 194 100" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4" vector-effect="non-scaling-stroke"/>
        <line x1="0" y1="100" x2="200" y2="100" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="orb" id="sun" hidden><img src="img/sol.png" alt=""></div>
      <div class="orb moon" id="moon" hidden><img src="img/luna.png" alt=""></div>
      <div class="ends"><span id="endL"></span><span id="endR"></span></div>
    </div>
    <h3 id="skyTitle"></h3>
    <p class="when" id="skyWhen"></p>
    <div class="wx" id="wx" hidden></div>
  </section>

  <section id="casa" class="center">
    <h2 class="heading" data-t="houseTitle"></h2>
    <div class="render" id="render"></div>
    <p class="desc" id="desc"></p>
    <div class="gallery" id="gallery"></div>
  </section>

  <section class="rooms" id="habitaciones">
    <h2 class="heading" data-t="roomsTitle"></h2>
    <ul class="room-list" id="rooms"></ul>
  </section>

  <section class="amen" id="comodidades">
    <h2 class="heading" data-t="amenTitle"></h2>
    <ul class="amen-list" id="amen"></ul>
  </section>

  <section class="reserve" id="reservar">

    <p class="lead" data-t="bookLead"></p>
    <p class="avail-note" id="directNote"></p>

      <div class="cal">

    $("#extras").querySelectorAll("[data-usd]").forEach((el) => setUsd(el, Number(el.dataset.usd)));
    $("#ciT").textContent = R.checkin; $("#coT").textContent = R.checkout;
    $("#wifiBox").hidden = !R.wifi; if (R.wifi) $("#wifiName").textContent = R.wifi.red;
    $("#nearby").innerHTML = R.guia.cerca.map((c) => "<li><span>" + esc(t(c)) + "</span><span>" + esc(t(c.dato)) + "</span></li>").join("");
    $("#rules").innerHTML = R.guia.normas.map((c) => "<li><span>" + esc(t(c)) + "</span></li>").join("");
    const rv = R.resenas;
    $("#score").textContent = rv.nota.toLocaleString(lang === "es" ? "es-CR" : "en-US", { minimumFractionDigits: 1 });
    $("#stars").innerHTML = Array(5).fill(STAR).join(""); $("#count").textContent = L().reviews(rv.total);
    $("#quotes").innerHTML = rv.lista.map((r) => '<figure class="rq" style="margin:0"><p>' + esc(t(r.texto)) + "</p><cite>" + esc(r.autor) + "</cite></figure>").join("");
    $("#revLink").href = R.resenaUrl;
    $("#addr").textContent = t(R.lugar); $("#map").href = R.mapa; $("#hostBox").textContent = R.anfitrion.nombre;
    $("#ig").textContent = "@" + R.instagram; $("#ig").href = "https://instagram.com/" + R.instagram;
    $("#taxes").textContent = L().taxes(Math.round((R.impuesto || 0) * 100));
    $$("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    $$("[data-cur]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.cur === cur));
    renderStatus(); renderSky(); renderWeather(); renderCal(); renderSurvey(); observe();
  }

  /* ---------- Scroll ---------- */
  let io;
  function observe() {
    if (io) io.disconnect();
    io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) $$("#barNav a").forEach((a) => a.classList.toggle("on", a.dataset.id === e.target.id)); }), { rootMargin: "-45% 0px -50% 0px" });
    ["casa", "habitaciones", "comodidades", "reservar", "guia"].forEach((id) => io.observe(document.getElementById(id)));
  }
  const stage = $("#stage"), bar = $("#bar"), dock = $("#dock"), resv = $("#reservar"), demoBtn = $("#demoOpen");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let ticking = false;
  function onScroll() {
    const y = scrollY, h = innerHeight, past = y > h * 0.8;
    bar.classList.toggle("show", past);
    const r = resv.getBoundingClientRect(), inRes = r.top < h && r.bottom > 0;
    dock.classList.toggle("show", past && innerWidth < 760 && !inRes);
    if (DEMO) demoBtn.classList.toggle("show", past);
    if (!still && y < h * 1.3) { const k = Math.min(y / h, 1); stage.style.transform = "translateY(" + (k * h * 0.2) + "px) scale(" + (1 - k * 0.12) + ") rotate(" + (k * 10) + "deg)"; stage.style.opacity = 1 - k * 0.9; }
    ticking = false;
  }
  addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });

  /* ---------- Clics ---------- */
  function copyWifi() { const done = () => toast(L().wifiCopied); if (navigator.clipboard && R.wifi) navigator.clipboard.writeText(R.wifi.clave).then(done, done); else done(); }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.hasAttribute("data-close")) { close(); return; }
    if (b.dataset.lang) { lang = b.dataset.lang; store.set("villa-lang", lang); renderAll(); }
    else if (b.dataset.cur) {
      if (b.dataset.cur === cur) return; const prev = cur; cur = b.dataset.cur; store.set("villa-cur", cur);
      $$("[data-cur]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.cur === cur)); rollAll(prev);
      const sv = $("#saveTxt"); if (sv) { const qd = computeQuote(); if (qd) sv.textContent = L().save(usdTxt(qd.disc)); }
    }
    else if (b.id === "wifiCopy") copyWifi();
    else if (b.id === "topPal") open("#demoSheet");
    else if (b.id === "surveyOpen") { svStep("sv1"); open("#surveySheet"); }
    else if (b.dataset.rate) { rates[Number(b.dataset.rate)] = Number(b.dataset.v); renderSurvey(); }
    else if (b.id === "svNext") svStep(rates.reduce((a, c) => a + c, 0) / 3 >= 4 ? "svGood" : "svBad");
    else if (b.dataset.svc) { const i = Number(b.dataset.svc); badChips.has(i) ? badChips.delete(i) : badChips.add(i); renderSurvey(); }
    else if (b.id === "svSend") {
      const msg = [L().svMsg + R.nombre + ":", L().svItems.map((n, i) => n + " " + rates[i] + "/5").join(", ")];
      if (badChips.size) msg.push([...badChips].map((i) => L().svChips[i]).join(", ")); if ($("#svText").value.trim()) msg.push($("#svText").value.trim());
      window.open("https://wa.me/" + R.whatsapp + "?text=" + encodeURIComponent(msg.join("\n")), "_blank", "noopener"); svStep("svDone");
    }
    else if (b.dataset.p) { paleta = b.dataset.p; applyPaleta(); }
    else if (b.dataset.dl) { const c = document.querySelector("#" + b.dataset.dl + " canvas"); if (!c) return; const a = document.createElement("a"); a.download = b.dataset.dl + "-" + R.nombre.toLowerCase().replace(/\s+/g, "-") + ".png"; a.href = c.toDataURL("image/png"); a.click(); }
  });

  /* ---------- Panel de demo ---------- */
  if (DEMO) {
    $("#demo").hidden = false;
    const chip = $("#topChip"); chip.hidden = false; chip.textContent = "Paleta"; chip.id = "topPal";
    $("#pals").innerHTML = Object.entries(PALETAS).map(([k, v]) => '<button class="pal" type="button" data-p="' + k + '"><span class="sw' + (k === "auto" ? " auto" : "") + '" style="' + (v.bg ? "background:" + v.bg + ";" : "") + "--rim:" + (v.rim || "#5FD6C7") + '"></span>' + v.nombre + "</button>").join("");
    demoBtn.onclick = () => open("#demoSheet");
    if (window.QRCode) {
      const base = location.href.split("?")[0], opt = (text) => ({ text, width: 280, height: 280, colorDark: "#111111", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
      new QRCode($("#qrGuide"), opt(base + "?cliente=1#guia")); new QRCode($("#qrSurvey"), opt(base + "?cliente=1&encuesta=1"));
    }
  }

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

  buildRanges(); buildBooked();
  const t0 = today(); viewY = +t0.slice(0, 4); viewM = +t0.slice(5, 7) - 1;
  renderAll(); applyPaleta(); onScroll(); loadSheet(); loadWeather();
  if (q.get("encuesta") === "1") { svStep("sv1"); open("#surveySheet"); }
  setInterval(() => { renderStatus(); renderSky(); if (paleta === "auto") applyPaleta(); }, 60000);
})();
</script>
</body>
</html>
